<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大津線ダイヤ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大津線ダイヤ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4b3fd0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Old+Mincho:wght@400;700;900&family=Noto+Serif+JP:wght@400;600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&family=BIZ+UDPGothic:wght@400;700&family=Roboto+Condensed:wght@300;400;700&family=Barlow+Condensed:wght@300;400;500;600&family=Oswald:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1f2f7; --panel:#ffffff; --text:#1b1d2e; --mut:#666a82; --line:#d6d8e3;
  --acc:#4b3fd0; --accT:#ffffff; --field:#ffffff; --stage:#c9c9d2; --warn:#b3321f; --ok:#1d7a4a;
  --soft:#eceefa; --head:#f3f4fb; --cell:#fafbff; --green:#12705a; --selbg:#dcd8ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13141d; --panel:#1b1d2a; --text:#e7e8f2; --mut:#9a9eb9; --line:#33364b;
    --acc:#9aa1ff; --accT:#0f1030; --field:#242736; --stage:#0d0e15; --warn:#ff9c88; --ok:#7fd9a6;
    --soft:#262a45; --head:#20233a; --cell:#1f2233; --green:#2fb391; --selbg:#3a3870;
  }
}
:root[data-theme="dark"]{
  --bg:#13141d; --panel:#1b1d2a; --text:#e7e8f2; --mut:#9a9eb9; --line:#33364b;
  --acc:#9aa1ff; --accT:#0f1030; --field:#242736; --stage:#0d0e15; --warn:#ff9c88; --ok:#7fd9a6;
  --soft:#262a45; --head:#20233a; --cell:#1f2233; --green:#2fb391; --selbg:#3a3870;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.5 "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.primary{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:700}
button.green{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
button.soft{background:var(--soft);color:var(--acc);border-color:var(--soft)}
button.danger{color:var(--warn)}
button.dangerbg{background:#fde7e4;color:#b3321f;border-color:#f6c9c3;font-weight:700}
button.sm{min-height:34px;padding:3px 10px;font-size:14px}
button:disabled{opacity:.5}
header.top{display:flex;align-items:flex-end;gap:10px;padding:8px 12px 0;background:var(--head);border-bottom:1px solid var(--line);flex:none;overflow-x:auto;-webkit-overflow-scrolling:touch}
header.top .brand{font:700 20px/1 "Zen Kaku Gothic New",sans-serif;padding:0 6px 12px 2px;white-space:nowrap}
.navtabs{display:flex;gap:2px}
.navtabs button{border:0;border-radius:8px 8px 0 0;background:transparent;min-height:46px;padding:0 18px;font-weight:500;color:var(--mut);border-bottom:3px solid transparent}
.navtabs button[aria-selected=true]{background:var(--panel);color:var(--text);border-bottom-color:var(--acc);font-weight:700}
.acts{display:flex;gap:8px;align-items:center;padding-bottom:8px;margin-left:8px}
.acts select{width:auto;min-height:40px;padding:4px 8px;font-size:15px}
.pill{font-size:13px;background:var(--line);color:var(--mut);border-radius:6px;padding:4px 10px;white-space:nowrap}
.pill.ok{color:var(--ok)}
.acts .b-new{background:#46a0e0;color:#fff;border-color:#46a0e0;font-weight:700}
.acts .b-my{background:var(--soft);color:var(--acc)}
.view{flex:1;min-height:0;display:none}
/* 閲覧専用（公開用）：編集の入口をすべて隠す */
body.ro .acts>*:not(#diaSel):not([data-act=export]){display:none!important}
body.ro .navtabs [data-view=un],body.ro .navtabs [data-view=data]{display:none!important}
body.ro #side{display:none!important}
/* スタフ回収済みの本数（全列車の本数とともに） */
.stcount{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#1d216b}
.stcount b{font-size:16px}
.stc-bar{display:inline-block;width:72px;height:8px;border-radius:99px;background:#d9dcf0;overflow:hidden}
.stc-bar i{display:block;height:100%;background:#4f46e5}
.stc-sub{color:#667;font-size:12px}
body.ro #ttside [data-act=ttadd]{display:none!important}
/* 閲覧用：スジをタップすると出る、列車の時刻表 */
#tsheet{position:fixed;inset:0;z-index:5000;background:rgba(20,22,50,.5);display:none;align-items:flex-end;justify-content:center}
#tsheet.on{display:flex}
.ts-card{width:100%;max-width:560px;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;background:#ececec;border-radius:18px 18px 0 0;padding:14px 14px 30px;color:#1b1b22;font-family:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif}
@media(min-width:720px){#tsheet{align-items:center}.ts-card{border-radius:18px;max-height:86vh}}
.ts-x{position:sticky;top:0;float:right;z-index:2;border:0;background:#fff;border-radius:999px;width:38px;height:38px;font-size:20px;line-height:1;box-shadow:0 1px 6px rgba(0,0,0,.25);margin:0 0 -38px 8px}
.ts-head{background:#f7f7f7;border-radius:16px;padding:16px 16px 14px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.ts-row1{display:flex;align-items:center;gap:10px;padding-right:44px}
.ts-badge{color:#fff;font-weight:800;font-size:18px;padding:5px 11px;border-radius:8px;white-space:nowrap}
.ts-dest{font-size:24px;font-weight:800;line-height:1.2}.ts-dest small{font-size:14px;color:#666;font-weight:700;margin-left:2px}
.ts-no{margin-top:8px;color:#777;font-size:12px}.ts-no b{font-size:28px;color:#111;margin-left:6px;font-weight:800}
.ts-meta{margin-top:12px;border-top:1px dashed #cfcfcf;padding-top:10px;display:grid;gap:9px;font-size:15px}
.ts-chip{display:inline-block;background:#2a2d3a;color:#fff;font-weight:700;font-size:13px;padding:3px 10px;border-radius:6px;margin-right:10px;min-width:48px;text-align:center}
/* 離合（逆向きの列車とすれ違う所）：駅では駅名の下、駅の間では駅と駅の間に出す */
.ts-m{display:block;font-size:14px;font-weight:700;color:#b3261e;margin-top:2px}
.ts-gap{display:grid;grid-template-columns:84px 38px 1fr;align-items:center;min-height:34px}
.ts-gap .ts-meet{padding-left:6px}
.ts-gap .ts-node::before{top:0;bottom:0}
.ts-meet small{display:block;font-size:11px;color:#8a8a8a;font-weight:600}
.ts-list{background:#fbfaf7;border-radius:18px;margin-top:14px;padding:8px 14px 16px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.ts-st{display:grid;grid-template-columns:84px 38px 1fr auto;align-items:center;min-height:64px}
.ts-time{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.ts-time small{font-size:13px;color:#777;font-weight:700}
.ts-tag{display:block;font-size:11px;color:#888;font-weight:700;margin-top:2px}
.ts-node{position:relative;align-self:stretch;display:flex;justify-content:center;align-items:center}
.ts-node::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:6px;margin-left:-3px;background:#cbc9c0}
.ts-st:first-child .ts-node::before{top:50%}.ts-st:last-child .ts-node::before{bottom:50%}
.ts-node i{position:relative;width:24px;height:24px;border:5px solid #cbc9c0;background:#fff;border-radius:6px}
.ts-name{font-size:19px;font-weight:800;padding-left:6px}
.ts-sub{display:block;font-size:12px;color:#777;font-weight:600}
.ts-trk{color:#777;font-weight:700;font-size:14px;padding-left:8px}
.ts-pass .ts-time,.ts-pass .ts-name{color:#9a9a9a;font-weight:600}
.ts-pass .ts-node i{border-color:#ddd}
.view.on{display:flex}
#v-dia{flex-direction:column}
#view{flex:1 1 52%;min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--stage)}
.vtools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.vtools input[type=range]{flex:1;max-width:240px}
#scroller{flex:1;min-height:0;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px}
#cv{display:block;box-shadow:0 1px 8px rgba(0,0,0,.35);background:#fff}
#side{flex:1 1 48%;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;border-bottom:3px solid transparent;font-weight:500;min-height:44px}
.tabs button[aria-selected=true]{border-bottom-color:var(--acc);color:var(--acc);font-weight:700}
.pane{flex:1;overflow:auto;padding:12px 14px 24px;-webkit-overflow-scrolling:touch}
.pane[hidden]{display:none}
@media (min-width:900px) and (orientation:landscape){
  #v-dia{flex-direction:row}
  #view{flex:1 1 auto}
  #side{flex:0 0 400px;border-top:0;border-left:1px solid var(--line)}
}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px}
textarea{min-height:90px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.row>.fix{flex:none}
h2{font:700 15px/1.3 "Zen Kaku Gothic New",sans-serif;margin:18px 0 6px}
.tl{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.tr{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:6px 10px;font-size:14px;min-height:36px}
.tr.on{border-color:var(--acc);background:var(--selbg);box-shadow:inset 3px 0 0 var(--acc)}
.tr small{color:var(--mut);white-space:nowrap}
.hint{font-size:13px;color:var(--mut)}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;flex:none}
.chk input{width:20px;height:20px}
.page{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accT);border-color:var(--acc);position:relative}
.seg.wide{width:100%}.seg.wide button{flex:1}
.scrollbox{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pad{padding:12px 14px 30px}
/* 時刻表 */
#v-tt{flex-direction:row}
#ttside{display:none;flex:0 0 300px;overflow:auto;padding:4px 16px 24px;background:var(--panel);border-right:1px solid var(--line)}
#ttside h3{font:700 15px/1.3 sans-serif;margin:16px 0 0;padding:0 0 10px;border-bottom:1px solid var(--line)}
@media (min-width:900px){#ttside{display:block}}
table.tt{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;table-layout:fixed}
table.tt th,table.tt td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--cell)}
table.tt thead th{position:sticky;top:0;background:var(--head);z-index:2;padding:6px 2px;width:124px;font-weight:700;font-size:15px;text-align:center}
table.tt thead th small{display:block;font-weight:400;color:var(--mut);font-size:11px}
table.tt thead th.cs{background:var(--selbg)}
table.tt .stk{position:sticky;left:0;z-index:3;background:var(--head);width:84px;padding:6px 6px;text-align:left;font-weight:500;font-size:13px;line-height:1.25}
table.tt thead .stk{z-index:4}
table.tt td{padding:8px 2px;text-align:center;font-size:13.5px;height:46px;cursor:pointer;white-space:nowrap;overflow:hidden}
table.tt td.wide{width:150px}
table.tt td.sel{background:var(--selbg);outline:2px solid var(--acc);outline-offset:-2px}
table.tt td.colsel{background:var(--soft)}
table.tt td .pass{color:var(--mut)}
table.tt td .trk{color:var(--mut);font-size:11px}
/* 運用表 */
.usearch{border:1px solid var(--line);border-radius:10px;background:var(--cell);padding:10px;margin:0 0 14px}
.ures{max-height:260px;overflow:auto;margin-top:8px;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.ures label{display:flex;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px;min-height:42px;cursor:pointer}
.ures input[type=checkbox]{width:20px;height:20px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--soft);color:var(--acc);border-radius:999px;padding:0 2px 0 12px;font-weight:700;font-size:14px}
.chip button{min-height:30px;padding:0 9px;border:0;background:transparent;color:var(--acc)}
.lkrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.lkrow .hint{flex:1 1 100%}
.unit{border:1px solid var(--line);border-radius:10px;margin:0 0 14px;background:var(--cell);overflow:hidden}
.unit>.uh{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--head);border-bottom:1px solid var(--line)}
.unit>.uh input{width:84px;font-weight:700;min-height:36px;padding:4px 8px}
.unit table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.unit td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.unit td input{width:64px;min-height:34px;padding:3px 6px;text-align:center}
.gap.warn{color:var(--warn);font-weight:700}
.gap.ok{color:var(--ok)}
.gbar{position:relative;height:12px;background:var(--line);border-radius:6px;margin:8px 10px 10px;overflow:hidden}
.gbar i{position:absolute;top:0;bottom:0;background:var(--acc);border-radius:3px;opacity:.9}
/* データ */
table.dt{border-collapse:collapse;font-size:14px}
table.dt th{font-weight:500;color:var(--mut);padding:4px 6px;text-align:center;font-size:12px;position:sticky;top:0;background:var(--panel);z-index:1}
table.dt td{padding:2px 3px;border-bottom:1px solid var(--line)}
table.dt td input[type=text],table.dt td select{min-height:34px;padding:3px 6px;font-size:15px}
table.dt td.n{width:130px}table.dt td.v{width:66px}table.dt td.w{width:110px}
table.dt td.i{color:var(--mut);text-align:right;padding-right:8px;font-size:13px}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--cell)}
/* モーダル */
.modal{position:fixed;inset:0;background:rgba(10,10,24,.72);display:none;flex-direction:column;z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px);align-items:center;justify-content:center}
.modal.on{display:flex}
.modal .box{background:var(--panel);border-radius:14px;display:flex;flex-direction:column;min-height:0;flex:0 1 auto;max-height:100%;width:100%;max-width:880px;overflow:hidden}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.modal .mbody{flex:1;min-height:0;overflow:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}
.modal .mf{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.pg{margin:14px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--stage)}
.pg .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;background:var(--head);font-size:14px}
.pg .im{overflow:auto;max-height:46vh;padding:8px}
.pg img{display:block;width:100%;height:auto;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.slot{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.slot .nm{flex:1;min-width:0}
.slot small{color:var(--mut);display:block}
/* 一括編集 */
.bwrap{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.brow{display:grid;grid-template-columns:96px auto 1fr;gap:6px 8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .bn{font-weight:700;font-size:15px}
.brow .tm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.brow input[type=text]{min-height:38px;padding:4px 8px;font-size:15px;width:112px}
.brow input.bt{width:64px}
.brow .seg button{min-height:34px;padding:2px 10px;font-size:14px}
.brow.off input[type=text]{opacity:.35}
@media (max-width:640px){.brow{grid-template-columns:1fr}}
#printArea{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea img{display:block;page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">大津線ダイヤ</div>
  <nav class="navtabs" role="tablist">
    <button role="tab" data-view="dia" aria-selected="true">ダイヤグラム</button>
    <button role="tab" data-view="tt" aria-selected="false">時刻表</button>
    <button role="tab" data-view="un" aria-selected="false">運用表</button>
    <button role="tab" data-view="data" aria-selected="false">詳細データ</button>
  </nav>
  <div class="acts">
    <select id="diaSel" aria-label="ダイヤ"></select>
    <button data-act="diamgr">ダイヤ編集</button>
    <span class="pill" id="saveState">自動保存: 待機</span>
    <button class="b-new" data-act="new">新規作成</button>
    <button data-act="open">既存データを開く（ファイルを開く）</button>
    <button data-act="imp">臨時ダイヤ取り込み</button>
    <button data-act="stt">駅時刻表PDF取り込み</button>
    <button class="b-my" data-act="mydia">マイダイヤ</button>
    <button class="primary" data-act="oud">OuDia保存</button>
    <button data-act="json">JSON保存</button>
    <button data-act="export">画像・印刷</button>
    <button data-act="reset">初期化</button>
    <input type="file" id="fileIn" hidden>
  </div>
</header>

<section class="view on" id="v-dia">
  <div id="view">
    <div class="vtools"><span>表示の大きさ</span><input type="range" id="zoom" min="30" max="160" value="100" aria-label="表示の大きさ"><span id="zoomv">100%</span><button class="sm" data-act="fit">幅に合わせる</button><button class="sm" data-act="z100">100%</button><span class="hint">スジをタップで列車を選択</span><div class="stcount" id="stcount" aria-live="polite"></div></div>
    <div id="scroller"><canvas id="cv" width="10" height="10"></canvas></div>
  </div>
  <aside id="side">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="trains" aria-selected="true">列車</button>
      <button role="tab" data-tab="add" aria-selected="false">列車を追加</button>
      <button role="tab" data-tab="link" aria-selected="false">運用つなぎ</button>
      <button role="tab" data-tab="set" aria-selected="false">表示・文字</button>
    </div>
    <div class="pane" id="p-trains"></div>
    <div class="pane" id="p-add" hidden></div>
    <div class="pane" id="p-link" hidden></div>
    <div class="pane" id="p-set" hidden></div>
  </aside>
</section>

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='otsu-dia-v3', SLOTS='otsu-dia-slots3';
const MIN=['Shippori Mincho','Zen Old Mincho','Noto Serif JP'];
const GO=['Zen Kaku Gothic New','Noto Sans JP','BIZ UDPGothic'];
const NU=['Roboto Condensed','Barlow Condensed','Noto Sans JP','Zen Kaku Gothic New','Oswald'];
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== OuDia 読み書き（旧だいやだいやの .oud 形式） ===== */
function fmtF(m){const tot=Math.round(m*60),sec=tot%60,mm=Math.floor(tot/60);return pad(Math.floor(mm/60))+pad(mm%60)+(sec?pad(sec):'')}
function parseT(s){
  s=(s||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[：:\s]/g,'');
  if(!/^\d{3,6}$/.test(s))return null;
  if(s.length===3||s.length===5)s='0'+s;
  const h0=+s.slice(0,2),mi=+s.slice(2,4),ss=s.length===6?+s.slice(4,6):0;
  if(mi>59||ss>59)return null;
  return (h0<3?h0+24:h0)*60+mi+ss/60;
}
function serCell(c){
  if(!c)return '0';
  if(c.r!=null)return c.r;
  let tm='';
  if(c.a!=null&&c.d!=null)tm=(c.a===c.d)?fmtF(c.d):fmtF(c.a)+'/'+fmtF(c.d);
  else if(c.a!=null)tm=fmtF(c.a)+'/';
  else if(c.d!=null)tm=fmtF(c.d);
  return c.m+';'+tm+(c.t?'$'+c.t:'');
}
function parseCell(s){
  if(s==='0'||s==='')return null;
  const k=s.indexOf(';');
  const m=k<0?(+s||0):(+s.slice(0,k)||0);
  let body=k<0?'':s.slice(k+1),t='';
  const di=body.indexOf('$'); if(di>=0){t=body.slice(di+1);body=body.slice(0,di)}
  let a=null,d=null,bad=false;
  const P=x=>{const v=parseT(x);if(v==null)bad=true;return v};
  if(body.includes('/')){const [x,y]=body.split('/');a=x?P(x):null;d=y?P(y):null}
  else if(body)d=P(body);
  const c={m,a,d,t};
  if(bad||serCell(c)!==s)c.r=s;
  return c;
}
function parseTree(lines){
  let pos=0;
  const block=name=>{
    const node={name,props:[],kids:[]};
    while(pos<lines.length){
      const l=lines[pos++];
      if(l==='.')return node;
      if(!l.includes('=')&&l.endsWith('.'))node.kids.push(block(l.slice(0,-1)));
      else{const k=l.indexOf('=');node.props.push(k<0?[l,null]:[l.slice(0,k),l.slice(k+1)])}
    }
    return node;
  };
  const root={name:'',props:[],kids:[]};
  while(pos<lines.length){
    const l=lines[pos++];
    if(l==='')continue;
    if(!l.includes('=')&&l.endsWith('.'))root.kids.push(block(l.slice(0,-1)));
    else{const k=l.indexOf('=');root.props.push(k<0?[l,null]:[l.slice(0,k),l.slice(k+1)])}
  }
  return root;
}
const pget=(n,k)=>{const p=n.props.find(x=>x[0]===k);return p?p[1]:''};
const pextra=(n,known)=>n.props.filter(p=>!known.includes(p[0]));
function colFromOud(s){ // 00BBGGRR
  if(!/^[0-9a-fA-F]{8}$/.test(s||''))return '#0042a9';
  return '#'+s.slice(6,8)+s.slice(4,6)+s.slice(2,4);
}
function colToOud(h){h=h.replace('#','');return '00'+h.slice(4,6)+h.slice(2,4)+h.slice(0,2)}
function parseOud(text){
  const root=parseTree(text.replace(/\r\n/g,'\n').split('\n'));
  const ro=root.kids.find(k=>k.name==='Rosen');
  if(!ro)throw new Error('Rosen がありません');
  const stations=ro.kids.filter(k=>k.name==='Eki').map(k=>({
    n:pget(k,'Ekimei'),dist:+pget(k,'NextEkiDistance')||0,ex:pextra(k,['Ekimei','NextEkiDistance'])}));
  const N=stations.length;
  const types=ro.kids.filter(k=>k.name==='Ressyasyubetsu').map(k=>({
    n:pget(k,'Syubetsumei'),cs:pget(k,'DiagramSenColor'),color:colFromOud(pget(k,'DiagramSenColor')),
    ex:pextra(k,['Syubetsumei','DiagramSenColor'])}));
  let id=1;
  const TOK_RE=/〔(出庫|入庫|スタフ|つなぎ|運用|地下鉄|回収):([^〕]*)〕/g;
  const ioFind=(nm,ix)=>{ix=+ix;if(stations[ix]&&stations[ix].n===nm)return ix;const j=stations.findIndex(x=>x.n===nm);return j>=0?j:(stations[ix]?ix:null)};
  const mkTrain=(k,rev)=>{
    const parts=pget(k,'EkiJikoku').split(',');
    while(parts.length<N)parts.push('0');
    const c=new Array(N).fill(null);
    for(let j=0;j<N;j++){const cell=parseCell(parts[j]);c[rev?N-1-j:j]=cell}
    const ex=pextra(k,['Houkou','Syubetsu','Ressyabangou','EkiJikoku']).map(q=>q.slice());
    const t={id:id++,no:pget(k,'Ressyabangou'),type:+pget(k,'Syubetsu')||0,c,unit:'',color:'',ex};
    // 出庫(○)・入庫(△)は、備考(Bikou)に〔出庫:駅名@番号〕〔入庫:駅名@番号〕として保存してある
    const bi=ex.findIndex(q=>q[0]==='Bikou');
    if(bi>=0&&typeof ex[bi][1]==='string'){
      ex[bi][1]=ex[bi][1].replace(TOK_RE,(m,kind,body)=>{
        if(kind==='出庫'||kind==='入庫'){if(body==='なし')t[kind==='出庫'?'out':'inn']=false;else{const q=/^([^@]*)@(\d+)$/.exec(body);if(q){const v=ioFind(q[1],q[2]);if(v!=null)t[kind==='出庫'?'out':'inn']=v}}}
        else if(kind==='スタフ'){const q=/^([^@]*)@(\d+):(.*)$/.exec(body);
          if(q){const v=ioFind(q[1],q[2]);if(v!=null){const ma=/着([\d:]+)/.exec(q[3]),md=/発([\d:]+)/.exec(q[3]);
            const e={};if(ma&&parseT(ma[1])!=null)e.a=parseT(ma[1]);if(md&&parseT(md[1])!=null)e.d=parseT(md[1]);
            if(e.a!=null||e.d!=null){t.sf=t.sf||{};t.sf[v]=e}}}}
        else if(kind==='運用')t.unit=body;
        else if(kind==='回収')t.staff=true;
        else if(kind==='地下鉄'){if(/^[CKM]$/.test(body))t.realEnd=body}
        else if(kind==='つなぎ'){const q=/^([^@]*)@(\d+):(.+)$/.exec(body);if(q)t._lk={no:q[1],st:+q[2],lo:parseT(q[3])}}
        return '';
      });
      if(ex[bi][1]==='')ex.splice(bi,1);
    }
    return t;
  };
  const dias=ro.kids.filter(k=>k.name==='Dia').map(k=>({
    name:pget(k,'DiaName'),
    kudari:((k.kids.find(x=>x.name==='Kudari')||{kids:[]}).kids).filter(x=>x.name==='Ressya').map(x=>mkTrain(x,false)),
    nobori:((k.kids.find(x=>x.name==='Nobori')||{kids:[]}).kids).filter(x=>x.name==='Ressya').map(x=>mkTrain(x,true)),
    ex:pextra(k,['DiaName'])}));
  dias.forEach(d=>{ // 〔つなぎ〕の印から、運用つなぎ（次の列車）を復元する
    const all=[...d.kudari,...d.nobori];d.links=[];
    all.forEach(a=>{
      const lk=a._lk;if(!lk)return;delete a._lk;
      const cand=all.filter(x=>x!==a&&x.no===lk.no);
      let b=cand.find(x=>{const q=trainSpan(x);return q&&q.s0===lk.st&&lk.lo!=null&&Math.abs(q.lo-lk.lo)<0.02});
      if(!b&&cand.length===1)b=cand[0];
      if(b)d.links.push({a:a.id,b:b.id});
    });
  });
  return {fileType:pget(root,'FileType')||'OuDia.1',rootEx:pextra(root,['FileType']),
    rosen:pget(ro,'Rosenmei'),rosenEx:pextra(ro,['Rosenmei']),stations,types,dias,nextId:id};
}
function writeOud(D){
  const L=[];
  const props=ps=>ps.forEach(p=>L.push(p[1]==null?p[0]:p[0]+'='+p[1]));
  const has=(ex,k)=>(ex||[]).some(p=>p[0]===k);
  const rx=D.rosenEx||[],rootEx=D.rootEx||[];
  const rxv=(k,d)=>{const q=rx.find(p=>p[0]===k);return q?q[1]:d};
  /* 標準のOuDia形式（OuDia.1.02）に合わせて書き出す：他のソフト（CloudDia など）が必要とする項目を省かない */
  L.push('FileType='+((!D.fileType||D.fileType==='OuDia.1')?'OuDia.1.02':D.fileType));
  props(rootEx.filter(p=>p[0]!=='FileTypeAppComment'));
  L.push('Rosen.'); L.push('Rosenmei='+D.rosen);
  props(rx.filter(p=>!['KitenJikoku','DiagramDgrYZahyouKyoriDefault','Comment'].includes(p[0])));
  const NS=D.stations.length;
  // 項目の順番は、標準の並びに固定する（読み込み→書き出しを繰り返しても、同じ形になる）
  const getv=(ex,k)=>{const q=(ex||[]).find(p=>p[0]===k);return q?q[1]:undefined};
  const restOf=(ex,keys)=>(ex||[]).filter(p=>!keys.includes(p[0]));
  D.stations.forEach((s,i)=>{
    L.push('Eki.');L.push('Ekimei='+s.n);
    L.push('Ekijikokukeisiki='+(getv(s.ex,'Ekijikokukeisiki')??(i===0?'Jikokukeisiki_NoboriChaku':i===NS-1?'Jikokukeisiki_KudariChaku':'Jikokukeisiki_Hatsu')));
    L.push('Ekikibo='+(getv(s.ex,'Ekikibo')??'Ekikibo_Ippan'));
    L.push('NextEkiDistance='+s.dist);props(restOf(s.ex,['Ekijikokukeisiki','Ekikibo']));L.push('.');
  });
  D.types.forEach(t=>{
    L.push('Ressyasyubetsu.');L.push('Syubetsumei='+t.n);
    L.push('JikokuhyouMojiColor='+(getv(t.ex,'JikokuhyouMojiColor')??'00000000'));
    L.push('JikokuhyouFontIndex='+(getv(t.ex,'JikokuhyouFontIndex')??'0'));
    L.push('DiagramSenColor='+(t.cs&&colFromOud(t.cs)===t.color?t.cs:colToOud(t.color)));
    L.push('DiagramSenStyle='+(getv(t.ex,'DiagramSenStyle')??'SenStyle_Jissen'));
    L.push('StopMarkDrawType='+(getv(t.ex,'StopMarkDrawType')??'EStopMarkDrawType_DrawOnStop'));
    props(restOf(t.ex,['JikokuhyouMojiColor','JikokuhyouFontIndex','DiagramSenStyle','StopMarkDrawType']));L.push('.');
  });
  const N=D.stations.length;
  let curD=null;const trainById=new Map();
  const trainOut=(t,rev)=>{
    L.push('Ressya.');L.push('Houkou='+(rev?'Nobori':'Kudari'));L.push('Syubetsu='+t.type);L.push('Ressyabangou='+t.no);
    const parts=[];
    for(let j=0;j<N;j++)parts.push(serCell(t.c[rev?N-1-j:j]));
    L.push('EkiJikoku='+parts.join(','));
    // ○出庫・△入庫は、OuDiaの「備考」の末尾に印を付けて保存する（読み込むと元に戻る）
    let ex=(t.ex||[]).map(q=>q.slice());
    const bi=ex.findIndex(q=>q[0]==='Bikou');
    if(bi>=0&&typeof ex[bi][1]==='string')ex[bi][1]=ex[bi][1].replace(/〔(?:出庫|入庫|スタフ|つなぎ|運用|地下鉄|回収):[^〕]*〕/g,'');
    let tok='';
    if(typeof t.out==='number'&&D.stations[t.out])tok+=`〔出庫:${D.stations[t.out].n}@${t.out}〕`;else if(t.out===false)tok+='〔出庫:なし〕';
    if(typeof t.inn==='number'&&D.stations[t.inn])tok+=`〔入庫:${D.stations[t.inn].n}@${t.inn}〕`;else if(t.inn===false)tok+='〔入庫:なし〕';
    if(t.sf)Object.keys(t.sf).sort((x,y)=>x-y).forEach(k=>{const e=t.sf[k];if(!D.stations[k]||!e)return;
      tok+=`〔スタフ:${D.stations[k].n}@${k}:`+(e.a!=null?'着'+hms(e.a):'')+(e.d!=null?'発'+hms(e.d):'')+'〕'});
    if(t.staff||hasSec(t))tok+='〔回収:済〕';
    const un=String(t.unit||'').trim();if(un)tok+=`〔運用:${un}〕`;
    const re=t.realEnd||(miList().includes(noCore(t.no))?'M':'');if(re)tok+=`〔地下鉄:${re}〕`;
    const nb=curD&&(curD.links||[]).map(l=>l.a===t.id?trainById.get(l.b):null).find(Boolean);
    if(nb){const q=trainSpan(nb);if(q)tok+=`〔つなぎ:${nb.no}@${q.s0}:${hms(q.lo)}〕`}
    if(tok){if(bi>=0)ex[bi][1]=(ex[bi][1]||'')+tok;else ex.push(['Bikou',tok])}
    else if(bi>=0&&ex[bi][1]==='')ex.splice(bi,1);
    props(ex);L.push('.');
  };
  D.dias.forEach(d=>{
    curD=d;trainById.clear();[...d.kudari,...d.nobori].forEach(t=>trainById.set(t.id,t));
    L.push('Dia.');L.push('DiaName='+d.name);props(d.ex||[]);
    L.push('Kudari.');d.kudari.forEach(t=>trainOut(t,false));L.push('.');
    L.push('Nobori.');d.nobori.forEach(t=>trainOut(t,true));L.push('.');
    L.push('.');
  });
  L.push('KitenJikoku='+rxv('KitenJikoku','000'));
  L.push('DiagramDgrYZahyouKyoriDefault='+rxv('DiagramDgrYZahyouKyoriDefault','60'));
  L.push('Comment='+String(rxv('Comment','')||'').replace(/〔図:[^〕]*〕/g,'')+(D.meta?'〔図:'+encodeURIComponent(JSON.stringify(D.meta))+'〕':''));
  L.push('.');
  const F='PointTextHeight=9;Facename=ＭＳ ゴシック';
  ['DispProp.','JikokuhyouFont='+F,'JikokuhyouFont='+F+';Bold=1','JikokuhyouFont='+F+';Itaric=1','JikokuhyouFont='+F+';Bold=1;Itaric=1',
   'JikokuhyouFont='+F,'JikokuhyouFont='+F,'JikokuhyouFont='+F,'JikokuhyouFont='+F,'JikokuhyouVFont=PointTextHeight=9;Facename=@ＭＳ ゴシック',
   'DiaEkimeiFont='+F,'DiaJikokuFont='+F,'DiaRessyaFont='+F,'CommentFont='+F,'DiaMojiColor=00000000','DiaHaikeiColor=00FFFFFF','DiaRessyaColor=00000000','DiaJikuColor=00C0C0C0',
   'EkimeiLength=7','JikokuhyouRessyaWidth=5','.'].forEach(x=>L.push(x));
  const fa=rootEx.find(p=>p[0]==='FileTypeAppComment');
  L.push('FileTypeAppComment='+(fa&&fa[1]?fa[1]:'OuDia Ver. 1.02.05'));

/* ページ内ダイアログ（公開ページ内ではブラウザ標準の confirm/alert が使えないことがあるため） */
function uiDialog(msg,confirmMode,okLabel,cancelLabel){
  return new Promise(res=>{
    const m=$('#dlg'),yes=$('#dlgYes'),no=$('#dlgNo');
    $('#dlgMsg').textContent=msg;
    yes.textContent=okLabel||'OK';
    no.textContent=cancelLabel||'キャンセル';no.style.display=confirmMode?'':'none';
    m.classList.add('on');
    const done=v=>{m.classList.remove('on');yes.onclick=no.onclick=null;res(v)};
    yes.onclick=()=>done(true);no.onclick=()=>done(false);
    yes.focus();
  });
}
const uiConfirm=msg=>uiDialog(msg,true,/削除/.test(msg)?'削除する':'OK');
const uiAlert=msg=>uiDialog(msg,false);
/* 大きな赤文字のアラート（画面に被せる）。内容を読む時間をおいてから、ボタンを出す */
function bigAlert(msg,opt){
  opt=opt||{};
  return new Promise(res=>{
    const old=document.getElementById('bigAlert');if(old)old.remove();
    const ov=document.createElement('div');ov.id='bigAlert';ov.setAttribute('role','alertdialog');ov.setAttribute('aria-modal','true');
    ov.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto';
    ov.innerHTML=`<div style="background:#fff;border:6px solid #d00000;border-radius:14px;max-width:780px;width:100%;padding:22px 22px 18px;box-shadow:0 8px 40px rgba(0,0,0,.5)">
      <div style="color:#d00000;font-weight:900;font-size:clamp(22px,3.6vw,34px);line-height:1.5;white-space:pre-wrap;word-break:break-all">⚠ ${esc(msg)}</div>
      <div id="baBtns" style="margin-top:18px;min-height:58px;display:flex;gap:12px;justify-content:flex-end;align-items:center"><span style="color:#888;font-size:14px">内容をお読みください…</span></div></div>`;
    document.body.appendChild(ov);
    const delay=Math.min(4500,1200+String(msg).length*45);
    setTimeout(()=>{
      const bx=ov.querySelector('#baBtns');if(!bx)return;
      bx.innerHTML='';
      const mk=(t,v,main)=>{const b=document.createElement('button');b.textContent=t;
        b.style.cssText='min-height:54px;padding:0 28px;font-size:22px;font-weight:800;border-radius:12px;border:2px solid #d00000;'+(main?'background:#d00000;color:#fff':'background:#fff;color:#d00000');
        b.onclick=()=>{ov.remove();res(v)};bx.appendChild(b);return b};
      if(opt.cancel)mk(opt.cancel,false,false);
      mk(opt.ok||'OK',true,true).focus();
    },delay);
  });
}

/* ---------- 時刻の表示 ---------- */
function fmtC(m){
  if(m==null||isNaN(m))return '';
  const tot=Math.round(m*60),sec=tot%60,mm=Math.floor(tot/60);
  const base=Math.floor(mm/60)%24+':'+pad(mm%60);
  return (sec||S.sec6)?base+':'+pad(sec):base;
}
const dur=m=>{const t=Math.round(Math.abs(m)*60);return Math.floor(t/60)+'分'+pad(t%60)+'秒'};

let SJIS_MAP=null;
function sjisEncode(str){
  if(!SJIS_MAP){
    SJIS_MAP=new Map();const dec=new TextDecoder('shift_jis');
    for(let b=0xA1;b<=0xDF;b++)SJIS_MAP.set(dec.decode(Uint8Array.of(b)),[b]);
    const lead=[];for(let a=0x81;a<=0x9F;a++)lead.push(a);for(let a=0xE0;a<=0xFC;a++)lead.push(a);
    for(const a of lead)for(let b=0x40;b<=0xFC;b++){if(b===0x7F)continue;const ch=dec.decode(Uint8Array.of(a,b));if(ch.length===1&&ch!=='\uFFFD'&&!SJIS_MAP.has(ch))SJIS_MAP.set(ch,[a,b])}
  }
  const out=[],bad=new Set();
  for(const ch of str){
    const c=ch.codePointAt(0);
    if(c<0x80){out.push(c);continue}
    const m=SJIS_MAP.get(ch);
    if(m)m.forEach(x=>out.push(x));else{out.push(0x3F);bad.add(ch)}
  }
  return {bytes:Uint8Array.from(out),bad:[...bad]};
}

  w.write(new TextEncoder().encode(str));w.close();
  const u=new Uint8Array(await new Response(cs.readable).arrayBuffer());
  let bin='';for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));

function hasSec(t){ // 秒スジ：スタフ時刻がある、または基本の時刻に秒が入っている
  if(t.sf&&Object.keys(t.sf).length)return true;

    if(e.a!=null){const b=c.a??c.d;if(b!=null)an.push([b,e.a-b])}

const shortName=i=>S.stations[i].n;

/* ---------- レイアウト ---------- */
const RW=560; // 最後の1枚の右側（駅名・記事欄）の幅
function layout(o={}){
  const L={titleW:132};
  const cw=[46,48,48,48,172];
  L.colX=[];let x=L.titleW;cw.forEach(w=>{L.colX.push(x);x+=w});
  L.panelR=x;
  L.left=o.left!==false;L.right=!!o.right;L.fl=o.fl!==false;L.fr=o.fr!==false;
  L.gridX=L.left?x+26:0;L.padR=o.padR??28;
  L.ppm=o.ppm??S.ppm;L.t0=o.t0??(S.startHour*60+(S.startMin||0));L.t1=o.t1??(S.endHour*60+(S.endMin||0));
  L.paper=o.paper??S.paper;L.pageLabel=o.pageLabel||'';L.hit=o.hit||null;L.sel=o.sel??null;
  L.gridW=(L.t1-L.t0)*L.ppm;
  L.W=o.W??(L.gridX+L.gridW+(L.right?RW:0)+L.padR);
  L.headerH=98;
  let y=L.headerH;L.blocks=[];
  S.blocks.forEach(b=>{
    const ids=visIds(b); if(!ids.length)return;
    const top=y,hs=ids.map((_,k)=>k===0?24:(b.rowH||24)),gridTop=top+hs[0],ys=[gridTop];
    for(let i=1;i<ids.length;i++)ys.push(ys[i-1]+hs[i]);
    const bottom=ys[ys.length-1],stY={};ids.forEach((id,k)=>stY[id]=ys[k]);
    L.blocks.push({label:b.label,closure:b.closure,track:b.track,from:b.from,to:b.to,ids,hs,ys,top,gridTop,bottom,stY});
    y=bottom+80;
  });
  const lb=L.blocks[L.blocks.length-1];
  L.footTop=(lb?lb.bottom:L.headerH)+50;L.H=L.footTop+86;
  return L;
}
const INK_RED='#a1263b';
function diaInk(d){
  if(d&&d.ink)return d.ink;
  if(d&&/休日/.test(d.name||'')&&!/平日/.test(d.name||''))return INK_RED;
  return S.ink;
}
const kindOf=ty=>{const n=(S.types[ty]&&S.types[ty].n)||'';return n.includes('回送')?'kaiso':(n.includes('不定期')||n.includes('臨時'))?'futei':'normal'};

/* ---------- 描画 ---------- */
function draw(ctx,L){
  const ink=diaInk(curDia()),ppm=L.ppm;
  const FM=(w,px)=>`${w} ${px}px "${S.fMin}","Hiragino Mincho ProN",serif`;
  const FG=(w,px)=>`${w} ${px}px "${S.fGo}","Hiragino Sans",sans-serif`;
  const FN=(w,px)=>`${w} ${px}px "${S.fNum}","Helvetica Neue",sans-serif`;
  const X=t=>L.gridX+(t-L.t0)*ppm;
  ctx.fillStyle=L.paper;ctx.fillRect(0,0,L.W,L.H);
  ctx.strokeStyle=ink;ctx.fillStyle=ink;ctx.lineCap='butt';ctx.lineJoin='miter';
  const line=(x1,y1,x2,y2,w=1,a=1)=>{ctx.globalAlpha=a;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.globalAlpha=1};
  const txt=(s,x,y,font,align='center',base='middle')=>{ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;ctx.fillText(s,x,y)};
  const stack=(s,cx,y0,step,font)=>{[...s].forEach((c,i)=>txt(c,cx,y0+i*step,font))};
  const just=(s,cx,cy,span,fs,font)=>{
    const a=[...s];if(a.length===1){txt(s,cx,cy,font);return}
    const tot=Math.max(span,a.length*fs),step=(tot-fs)/(a.length-1);
    a.forEach((c,i)=>txt(c,cx-tot/2+fs/2+i*step,cy,font));
  };
  const wrap=(s,w,font)=>{ctx.font=font;const out=[];String(s||'').split('\n').forEach(par=>{let cur='';for(const ch of par){if(ctx.measureText(cur+ch).width>w&&cur){out.push(cur);cur=ch}else cur+=ch}out.push(cur)});return out};
  const cx=L.colX;

  /* 外枠（つなげて貼れるよう、左端は最初の1枚、右端は最後の1枚だけ） */
  ctx.lineCap='square';
  const fx0=L.fl?10:0,fx1=L.fr?L.W-10:L.W;
  line(fx0,10,fx1,10,2.5);line(fx0,L.H-10,fx1,L.H-10,2.5);
  if(L.fl)line(10,10,10,L.H-10,2.5);
  if(L.fr)line(L.W-10,10,L.W-10,L.H-10,2.5);
  ctx.lineCap='butt';
  if(L.pageLabel)txt(L.pageLabel,L.W/2,L.H-16,FN(500,14));

  if(L.left){
    const tw=L.titleW;
    line(tw-7,10,tw-7,L.H-10,1.4);line(tw,10,tw,L.H-10,3);
    const tcx=(10+tw-7)/2,tl=[...S.title].length;
    stack(S.title,tcx,78,Math.min(54,(L.H*.56)/Math.max(tl,1)),FM(500,46));
    const by=Math.round(L.H*.6);
    const dl=dayLabel(curDia()),dn=Math.max(1,[...dl].length),bh=24+52*dn; // 枠の高さは、文字数に合わせる（2文字で128）
    ctx.lineWidth=1.4;ctx.strokeRect(tcx-34,by,68,bh);
    stack(dl,tcx,by+38,52,FM(500,38));
    txt(S.no,tcx,by+bh+40,FG(700,27));
    const rv=revText(curDia()).split('\n');
    rv.forEach((s,i)=>txt(s,tcx,L.H-70-(rv.length-1-i)*30,FG(400,19)));
    [1,2,3,4].forEach(k=>line(cx[k],10,cx[k],L.headerH,1));
    line(cx[0],L.headerH,L.panelR,L.headerH,2);line(L.panelR,10,L.panelR,L.headerH,1.5);
    stack('線別',cx[0]+23,40,28,FG(500,19));
    stack('区間粁程',cx[1]+24,24,19,FG(500,16));
    stack('累計粁程',cx[2]+24,24,19,FG(500,16));
    stack('標準勾配',cx[3]+24,24,19,FG(500,16));
    txt('駅　　　名',(cx[4]+L.panelR)/2,52,FG(500,22));
  }
  const x0=L.W-RW; // 右の駅名・記事欄の左端
  const rc=[x0,x0+150,x0+196,x0+244,x0+290];

  L.blocks.forEach(b=>{
    const {ids,ys,hs,gridTop,bottom}=b;
    const sx=L.left?L.panelR:L.gridX, gEnd=L.gridX+L.gridW;
    if(L.left){
      line(cx[0],gridTop,cx[0],bottom,1.5);
      line(cx[1],gridTop,cx[1],bottom,1);
      [2,3].forEach(k=>line(cx[k],b.top,cx[k],bottom,1));
      line(cx[4],b.top,cx[4],bottom,1);line(L.panelR,b.top,L.panelR,bottom,1.5);
    }
    ids.forEach((id,k)=>{
      const s=S.stations[id],y=ys[k],cy=y-hs[k]/2;
      if(L.left){
        line(k===0?cx[0]:cx[1],y,L.panelR,y,k===0?1.6:1);
        txt(s.iv,cx[2]-7,cy,FN(400,16),'right');
        txt(s.cum,cx[3]-7,cy,FN(400,16),'right');
        txt(s.gr,cx[4]-7,cy,FN(400,16),'right');
        if(s.mark){ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx[4]+10,cy,5,0,7);ctx.stroke()}
        just(s.disp||s.n,(cx[4]+L.panelR)/2+4,cy,120,15,FG(500,15));
      }
      line(sx,y,gEnd,y,1);
      if(L.right){ // 最後の1枚：右側にも駅名と区間粁程
        line(gEnd,y,x0,y,1);
        line(rc[0],y,rc[2],y,k===0?1.6:1);
        just(s.disp||s.n,x0+75,cy,112,13,FG(500,13));
        txt(s.iv,rc[2]-6,cy,FN(400,14),'right');
      }
    });
    if(L.left){
      line(cx[0],bottom,L.panelR,bottom,1.6);
      const lh=bottom-gridTop,step=Math.min(40,(lh-30)/[...b.label].length);
      stack(b.label,cx[0]+23,(gridTop+bottom)/2-([...b.label].length-1)*step/2,step,FM(500,27));
    }
    if(L.right){
      rc.forEach((x,k)=>line(x,b.top,x,bottom,k===0||k===4?1.5:1));
      line(rc[0],bottom,rc[4],bottom,1.6);
      const cl=[...(b.closure||'')],lh=bottom-gridTop,st2=Math.min(24,(lh-16)/Math.max(cl.length,1));
      stack(b.closure||'',(rc[2]+rc[3])/2,(gridTop+bottom)/2-(cl.length-1)*st2/2,st2,FG(500,16));
      const tx=(rc[3]+rc[4])/2;
      if(b.track==='単線')line(tx,gridTop,tx,bottom,2.6);
      else{line(tx-5,gridTop,tx-5,bottom,2.6);line(tx+5,gridTop,tx+5,bottom,2.6)}
    }
    for(let m=Math.ceil(L.t0-1e-6);m<=L.t1+1e-6;m++){
      const x=X(m),ty=(m%60===0)?3:(m%10===0)?2:(m%5===0)?1:0;
      if(ty===0&&ppm<4.5)continue;
      line(x,gridTop,x,bottom,[.5,.7,1.2,2.4][ty],[.3,.5,.85,1][ty]);
    }
    ctx.lineWidth=1.6;ctx.strokeRect(L.gridX,gridTop,L.gridW,bottom-gridTop);
  });

  /* 右側：見出しと「記事」欄（最後の1枚） */
  if(L.right){
    [0,1,2,3,4].forEach(k=>line(rc[k],10,rc[k],L.headerH,k===0||k===4?1.5:1));
    line(rc[0],L.headerH,rc[4],L.headerH,2);
    txt('駅　名',x0+75,60,FG(500,19));
    const vs=(s,xc,st,f)=>stack(s,xc,54-([...s].length-1)*st/2,st,f);
    vs('区間粁程',(rc[1]+rc[2])/2,17,FG(500,15));
    vs('閉そく方式',(rc[2]+rc[3])/2,15.5,FG(500,14));
    vs('線路種別',(rc[3]+rc[4])/2,17,FG(500,15));
    const bx0=x0+300,bx1=L.W-10,bw=bx1-bx0;
    ctx.lineWidth=2;ctx.strokeRect(bx0,10,bw,L.H-20);
    txt('記　事',(bx0+bx1)/2,42,FM(700,24));
    line(bx0,70,bx1,70,1.6);
    const divY=Math.round(L.H*.56);line(bx0,divY,bx1,divY,1.6);
    txt('1.　列車種別',bx0+16,100,FG(500,16),'left');
    const seen=new Set(),kinds=[];
    S.types.forEach((ty,i)=>{const nm=ty.n.replace(/^京津線/,'');if(!seen.has(nm)){seen.add(nm);kinds.push({n:nm,kind:kindOf(i)})}}); // 京津線普通は普通に統合
    let yy=146;
    kinds.slice(0,8).forEach(k=>{
      ctx.strokeStyle=ink;ctx.fillStyle=ink;ctx.lineWidth=1.7;
      ctx.beginPath();ctx.moveTo(bx0+22,yy);ctx.lineTo(bx0+104,yy);ctx.stroke();
      if(k.kind==='kaiso'){ctx.fillStyle=L.paper;ctx.fillRect(bx0+55,yy-4,14,8);ctx.lineWidth=1.2;ctx.strokeRect(bx0+55,yy-4,14,8);ctx.fillStyle=ink}
      if(k.kind==='futei'){ctx.lineWidth=1.4;line(bx0+57,yy-4,bx0+67,yy+4,1.4);line(bx0+57,yy+4,bx0+67,yy-4,1.4)}
      txt(k.n.endsWith('列車')?k.n:k.n+'列車',bx0+120,yy,FG(500,16),'left');
      yy+=36;
    });
    if([...curDia().kudari,...curDia().nobori].some(x=>x.staff)){
      ctx.strokeStyle=ink;ctx.lineWidth=S.staffW||3.2;ctx.beginPath();ctx.moveTo(bx0+22,yy);ctx.lineTo(bx0+104,yy);ctx.stroke();
      txt('スタフ回収済み',bx0+120,yy,FG(500,16),'left');yy+=36;
    }
    yy+=14;
    txt('2.　記　号',bx0+16,yy,FG(500,16),'left');yy+=40;
    ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(bx0+44,yy,11,0,7);ctx.stroke();
    txt('出庫',bx0+80,yy,FG(500,16),'left');yy+=40;
    ctx.beginPath();ctx.moveTo(bx0+44,yy-12);ctx.lineTo(bx0+56,yy+9);ctx.lineTo(bx0+32,yy+9);ctx.closePath();ctx.stroke();
    txt('入庫',bx0+80,yy,FG(500,16),'left');
    const nf=FG(700,15),lines=wrap(S.note,bw-28,nf);
    let ny=L.H-(S.credit?64:44)-(lines.length-1)*23;
    lines.forEach((s,i)=>txt(s,bx0+14,ny+i*23,nf,'left'));
    if(S.credit)txt(S.credit,bx1-12,L.H-34,FG(500,14),'right');
  }

  const hf=ppm<6?36:46;
  const ruler=yb=>{
    for(let m=Math.ceil(L.t0/10-1e-6)*10;m<L.t1-1e-6;m+=10){
      const x=X(m);
      if(x>L.gridX+L.gridW-6)continue;
      if(m%60===0){const hh=m/60;txt(String(hh>24?hh-24:hh),x+5,yb,FM(800,hf),'left','alphabetic')}
      else txt(String(m%60),x,yb+6,FN(500,19),'center','alphabetic');
    }
  };
  ruler(L.headerH-34);ruler(L.footTop+52);

  const dia=curDia(), all=[...dia.kudari,...dia.nobori];
  // 列車番号は、その列車の始発駅から数えて最初に線が引ける路線（ブロック）にだけ書く
  const lblFrom=new Map();
  all.forEach(t=>{
    const cnt={},order=[];
    tpoints(t).forEach(q=>{if(cnt[q.bi]==null){cnt[q.bi]=0;order.push(q.bi)}cnt[q.bi]++});
    const bi=order.find(k=>cnt[k]>=2);
    if(bi!=null)lblFrom.set(t.id,S.blocks[bi].from);
  });
  L.blocks.forEach(b=>{
    ctx.save();
    ctx.beginPath();ctx.rect(L.gridX,b.gridTop-44,L.gridW,b.bottom-b.gridTop+88);ctx.clip();
    const lblSrc=[],allSegs=[];
    const bIdx=S.blocks.findIndex(q=>q.from===b.from);
    all.forEach(t=>{
      // 時刻は tpoints を通す（スタフ秒の補間・始発の着／終着の発を使わない設定を反映）
      const pts=tpoints(t).filter(q=>q.bi===bIdx&&b.stY[q.st]!=null).map(q=>({st:q.st,A:q.A,D:q.D,y:b.stY[q.st],trk:t.c[q.st].t}));
      if(pts.length<2)return;
      const isSel=L.sel===t.id,kind=kindOf(t.type);
      const col=t.color||(S.useTypeColor&&S.types[t.type]?S.types[t.type].color:ink);
      ctx.strokeStyle=col;ctx.fillStyle=col;const lwT=t.staff?(isSel?5.2:(S.staffW||3.2)):(isSel?3.4:1.7);ctx.lineWidth=lwT;ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(X(pts[0].A),pts[0].y);
      const topSt=b.ids[0],botSt=b.ids[b.ids.length-1];
      const boxY=p=>{ // 折り返し（始終端駅での停車）は、番線ごとの深さのコ字線にする
        if(p.D===p.A||(p.st!==topSt&&p.st!==botSt))return null;
        const n=Math.min(3,parseInt(p.trk)||1);
        return p.y+(p.st===botSt?1:-1)*(10+9*n);
      };
      pts.forEach((p,i)=>{
        if(i>0)ctx.lineTo(X(p.A),p.y);
        if(p.D!==p.A){const by=boxY(p);if(by!=null){ctx.lineTo(X(p.A),by);ctx.lineTo(X(p.D),by)}ctx.lineTo(X(p.D),p.y)}
      });
      ctx.stroke();
      if(kind!=='normal'){ // 回送は□、不定期は×を、線全体の中央に1つだけ（駅が増えても増えない）
        const ss=[];let tot=0;
        for(let i=0;i<pts.length-1;i++){
          const x1=X(pts[i].D),y1=pts[i].y,x2=X(pts[i+1].A),y2=pts[i+1].y,len=Math.hypot(x2-x1,y2-y1);
          if(len>0){ss.push({x1,y1,x2,y2,len});tot+=len}
        }
        if(tot>=34){
          let h=tot/2;
          for(const g of ss){
            if(h<=g.len){
              const u=h/g.len;
              ctx.save();ctx.translate(g.x1+(g.x2-g.x1)*u,g.y1+(g.y2-g.y1)*u);ctx.rotate(Math.atan2(g.y2-g.y1,g.x2-g.x1));
              if(kind==='kaiso'){ctx.fillStyle=L.paper;ctx.fillRect(-7,-4,14,8);ctx.lineWidth=1.2;ctx.strokeRect(-7,-4,14,8)}
              else{ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-4,-4);ctx.lineTo(4,4);ctx.moveTo(-4,4);ctx.lineTo(4,-4);ctx.stroke()}
              ctx.restore();break;
            }
            h-=g.len;
          }
        }
      }
      ctx.fillStyle=col;
      const segs=[];
      {
        let px=X(pts[0].A),py=pts[0].y;
        const push=(x2,y2)=>{const s={x1:px,y1:py,x2,y2};segs.push(s);if(L.hit)L.hit.push({id:t.id,...s});px=x2;py=y2};
        pts.forEach((p,i)=>{
          if(i>0)push(X(p.A),p.y);
          if(p.D!==p.A){const by=boxY(p);if(by!=null){push(X(p.A),by);push(X(p.D),by)}push(X(p.D),p.y)}
        });
      }
      allSegs.push({id:t.id,segs,col,w:lwT});
      const em=effMarks(t);ctx.lineWidth=1.2;
      pts.forEach(p=>{
        if(em.out===p.st){ctx.beginPath();ctx.arc(X(p.A)-9,p.y+9,6,0,7);ctx.stroke()}
        if(em.inn===p.st){const x=X(p.D)+9,y=p.y-9;ctx.beginPath();ctx.moveTo(x,y-7);ctx.lineTo(x+7,y+5);ctx.lineTo(x-7,y+5);ctx.closePath();ctx.stroke()}
      });
      if(t.no&&lblFrom.get(t.id)===b.from)lblSrc.push({t,pts,col});
    });
    /* つなぎ線：運用でつながる2本の列車（前の列車の終着 → 次の列車の始発）を点線で結ぶ */
    // 始終端駅のコ型が重ならないよう、横に重なるものは段（深さ）を分ける
    const tierOf=new Map();
    {
      const its=[];
      (dia.links||[]).forEach(lk=>{
        const ta=all.find(x=>x.id===lk.a),tb=all.find(x=>x.id===lk.b);if(!ta||!tb)return;
        const sa=trainSpan(ta),sb=trainSpan(tb);if(!sa||!sb)return;
        if(sa.s1!==sb.s0||b.stY[sa.s1]==null)return;
        if(sa.s1!==b.ids[0]&&sa.s1!==b.ids[b.ids.length-1])return;
        its.push({lk,st:sa.s1,x1:X(sa.hi),x2:X(sb.lo)});
      });
      its.sort((p,q)=>p.x1-q.x1);
      const ends={};
      its.forEach(it=>{
        const arr=ends[it.st]=ends[it.st]||[];let t=0;
        while(t<arr.length&&arr[t]>it.x1-6)t++;
        arr[t]=Math.max(it.x1,it.x2);tierOf.set(it.lk,t);
      });
    }
    (dia.links||[]).forEach(lk=>{
      const ta=all.find(x=>x.id===lk.a),tb=all.find(x=>x.id===lk.b);if(!ta||!tb)return;
      const sa=trainSpan(ta),sb=trainSpan(tb);if(!sa||!sb)return;
      const ya=b.stY[sa.s1],yb=b.stY[sb.s0];if(ya==null||yb==null)return;
      const x1=X(sa.hi),x2=X(sb.lo),col=ta.color||ink,on=(L.sel===lk.a||L.sel===lk.b);
      const topSt=b.ids[0],botSt=b.ids[b.ids.length-1];
      const lkw=(ta.staff?(S.staffW||3.2):1.7)+(on?1.2:0); // 前の列車のスタフを回収済みなら、つなぎも太線
      ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineJoin='miter';ctx.lineCap='butt';
      ctx.beginPath();ctx.moveTo(x1,ya);
      if(sa.s1===sb.s0&&(sa.s1===topSt||sa.s1===botSt)){
        // 折返し：始終端駅では、番線ごとの深さの実線コ型（図の外側へ出る）
        const c1=ta.c[sa.s1],c2=tb.c[sb.s0];
        const n=Math.min(3,parseInt((c1&&c1.t)||(c2&&c2.t))||1);
        const thr0=isThrough(ta,tb,sa.s1),by=ya+(sa.s1===botSt?1:-1)*((thr0?12:10+9*n)+8*(tierOf.get(lk)||0));
        ctx.lineWidth=lkw;
        const thr=isThrough(ta,tb,sa.s1);if(thr)ctx.setLineDash([6,4]); // 地下鉄線へ直通：点線のコ型
        ctx.lineTo(x1,by);ctx.lineTo(x2,by);ctx.lineTo(x2,yb);ctx.stroke();ctx.setLineDash([]);
      }else if(ya===yb){ // 途中駅（近江神宮前など）での折返し：駅の位置に実線でつなぐ
        ctx.lineWidth=lkw;ctx.lineTo(x2,yb);ctx.stroke();
      }else{ // 駅が違うとき：点線で結ぶ
        ctx.lineWidth=on?3.4:2.2;ctx.setLineDash([6,4]);ctx.lineTo(x2,yb);ctx.stroke();ctx.setLineDash([]);
      }
      ctx.restore();
    });
    /* 列車番号：すべてのスジ・つなぎ線より前に、白地で描く。
       位置は全列車で統一＝始発駅を出てすぐ（始発から5駅以内のスジの上）。他の番号と重なるときだけ、5駅以内で先へずらす */
    {
      const MAXST=5,OFF=10.75,HH=8.25,placed=[],items=[];
      ctx.font=FN(500,14);
      const axes=o=>[[Math.cos(o.ang),Math.sin(o.ang)],[-Math.sin(o.ang),Math.cos(o.ang)]];
      const hit2=(p,q)=>{
        const dx=q.cx-p.cx,dy=q.cy-p.cy;
        for(const ax of [...axes(p),...axes(q)]){
          const pr=o=>{const u=axes(o);return Math.abs(u[0][0]*ax[0]+u[0][1]*ax[1])*o.hw+Math.abs(u[1][0]*ax[0]+u[1][1]*ax[1])*o.hh};
          if(Math.abs(dx*ax[0]+dy*ax[1])>pr(p)+pr(q))return false;
        }
        return true;
      };
      lblSrc.sort((p,q)=>(q.t.id===L.sel)-(p.t.id===L.sel));
      lblSrc.forEach(src=>{
        const {t,pts,col}=src,label=t.no,lw=ctx.measureText(label).width;
        const V=[[X(pts[0].D),pts[0].y]];
        for(let i=1;i<pts.length&&i<=MAXST;i++){
          V.push([X(pts[i].A),pts[i].y]);
          if(pts[i].D!==pts[i].A)V.push([X(pts[i].D),pts[i].y]);
        }
        const cum=[0];for(let i=1;i<V.length;i++)cum.push(cum[i-1]+Math.hypot(V[i][0]-V[i-1][0],V[i][1]-V[i-1][1]));
        const tot=cum[cum.length-1];
        const at=u=>{u=Math.max(0,Math.min(tot,u));let i=1;while(i<V.length-1&&cum[i]<u)i++;const sg=(cum[i]-cum[i-1])||1,r=(u-cum[i-1])/sg;return [V[i-1][0]+(V[i][0]-V[i-1][0])*r,V[i-1][1]+(V[i][1]-V[i-1][1])*r]};
        const geom=u=>{
          const p1=at(u-lw/2),p2=at(u+lw/2),ang=Math.atan2(p2[1]-p1[1],p2[0]-p1[0]);
          const mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2;
          return {label,col,mx,my,ang,cx:mx+OFF*Math.sin(ang),cy:my-OFF*Math.cos(ang),hw:lw/2+3,hh:HH,lw};
        };
        const base=tot>=lw+12?lw/2+6:tot/2;
        let pick=null,first=null;
        for(let u=base;u+lw/2<=tot+0.01||first===null;u+=12){
          const g=geom(u);if(first===null)first=g;
          if(!placed.some(o=>hit2(g,o))){pick=g;break}
          if(u+lw/2>tot)break;
        }
        const g=pick||first;placed.push(g);items.push(g);
      });
      items.forEach(o=>{
        ctx.save();ctx.translate(o.mx,o.my);ctx.rotate(o.ang);
        ctx.fillStyle='#ffffff';ctx.fillRect(-o.hw,-OFF-HH,o.hw*2,HH*2);
        ctx.font=FN(500,14);ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle=o.col;ctx.fillText(o.label,0,-OFF);
        ctx.restore();
      });
    }
    ctx.restore();
  });
  /* 路線をまたいで走る列車（例：石山坂本線の浜大津 → 京津線の浜大津 の回送）：実物の図と同じに、
     出る路線では、出る駅の行を右へ短い横線（出てから次の路線に現れるまでの時間）と、先端の下向き（行く向き）の矢印、
     入る路線では、入る駅の行（上下の端の駅なら外側の深さ）に、同じ時間の横線と矢印を引く */
  all.forEach(t=>{
    const ps=tpoints(t);
    for(let k=0;k+1<ps.length;k++){
      const p0=ps[k],q0=ps[k+1];if(p0.bi===q0.bi)continue;
      const ba=L.blocks.find(q=>q.stY[p0.st]!=null),bb=L.blocks.find(q=>q.stY[q0.st]!=null);
      if(!ba||!bb||ba===bb)continue;
      const col=t.color||(S.useTypeColor&&S.types[t.type]?S.types[t.type].color:ink);
      const lw=(t.staff?(S.staffW||3.2):1.7)+(L.sel===t.id?1.2:0),down=bb.gridTop>ba.gridTop,sg=down?1:-1;
      let xa=X(p0.D),xb=X(q0.A);if(xb-xa<12)xb=xa+12;
      const head=(xe,ye)=>{ctx.beginPath();ctx.moveTo(xe-5,ye-9*sg);ctx.lineTo(xe,ye);ctx.lineTo(xe+5,ye-9*sg);ctx.stroke()};
      ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='butt';ctx.lineJoin='miter';
      // 出る路線
      const ya=ba.stY[p0.st];
      ctx.beginPath();ctx.moveTo(xa,ya);ctx.lineTo(xb,ya);ctx.stroke();head(xb,ya);
      // 入る路線
      const yb=bb.stY[q0.st],edgeTop=q0.st===bb.ids[0],edgeBot=q0.st===bb.ids[bb.ids.length-1];
      const c0=t.c[q0.st],tn=Math.min(3,parseInt(c0&&c0.t)||1);
      const yd=edgeTop?yb-(10+9*tn):edgeBot?yb+(10+9*tn):yb;
      ctx.beginPath();ctx.moveTo(xa,yd);ctx.lineTo(xb,yd);if(yd!==yb&&k+1<ps.length-1)ctx.lineTo(xb,yb);ctx.stroke();head(xb,yd); // 入った駅で終わる列車は、その駅の折返しの線（コ型）が縦線を引くので、ここでは引かない
      ctx.restore();
    }
  });
  /* 路線をまたぐつなぎ（例：石山坂本線の浜大津止まり → 京津線の浜大津始発の回送）：2つの路線の間を点線で結ぶ */
  (dia.links||[]).forEach(lk=>{
    const ta=all.find(x=>x.id===lk.a),tb=all.find(x=>x.id===lk.b);if(!ta||!tb)return;
    const sa=trainSpan(ta),sb=trainSpan(tb);if(!sa||!sb||sa.s1===sb.s0)return;
    const ba=L.blocks.find(q=>q.stY[sa.s1]!=null),bb=L.blocks.find(q=>q.stY[sb.s0]!=null);
    if(!ba||!bb||ba===bb)return;
    const x1=X(sa.hi),y1=ba.stY[sa.s1],x2=X(sb.lo),y2=bb.stY[sb.s0],on=(L.sel===lk.a||L.sel===lk.b),col=ta.color||ink;
    if((S.crossStyle||'arrow')==='arrow'){ // 実物の図と同じ矢印：前の列車は到着駅の行から右へ、次の列車は発車駅の行に左から、短い横線を引き、先端に下向きの矢印（V）を付ける
      const LS=Math.max(18,L.ppm*2.5),lw=(ta.staff?(S.staffW||3.2):1.7)+(on?1.2:0);
      ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='butt';ctx.lineJoin='miter';
      const head=(xe,ye)=>{ctx.beginPath();ctx.moveTo(xe-5,ye-9);ctx.lineTo(xe,ye);ctx.lineTo(xe+5,ye-9);ctx.stroke()};
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1+LS,y1);ctx.stroke();head(x1+LS,y1);       // D0590 側：到着の行から右へ
      ctx.beginPath();ctx.moveTo(x2-LS,y2);ctx.lineTo(x2,y2);ctx.stroke();head(x2,y2);           // 0501 側：発車の行へ左から
      ctx.restore();return;
    }
    ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=on?3.4:2.2;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(x1,y1);
    if(S.crossStyle==='ortho'&&Math.abs(x1-x2)>0.5){ // 縦→横→縦（斜めにしない）。横は2つの路線の間の隙間を通す
      const ym=ba.gridTop<bb.gridTop?(ba.bottom+bb.gridTop)/2:(bb.bottom+ba.gridTop)/2;
      ctx.lineTo(x1,ym);ctx.lineTo(x2,ym);ctx.lineTo(x2,y2);
    }else ctx.lineTo(x2,y2);
    ctx.stroke();ctx.setLineDash([]);
    [[x1,y1],[x2,y2]].forEach(q=>{ctx.beginPath();ctx.arc(q[0],q[1],on?4:3,0,7);ctx.fill()});
    ctx.restore();
  });
}

const dispSt=i=>S.stations[i].n.replace(/（京津）$/,''); // 浜大津（京津）も、石山坂本線と同じ「浜大津」と表示する
/* 地下鉄へ直通する列車の、実際の行先：設定 → 御陵止まりの列車 → 列番のルール（Cあり＝太秦天神川、Cなし＝京都市役所前）の順に決める */
function realDestName(t){
  const nm={C:'太秦天神川',K:'京都市役所前',M:'御陵'};
  if(t.realEnd&&nm[t.realEnd])return nm[t.realEnd];
  if(miList().includes(noCore(t.no)))return '御陵';
  const m=/^(C?)\d{2}(\d{2})$/i.exec(_nd(String(t.no||'')).trim());
  if(m){const n=+m[2],T=n<20?0:Math.floor(n/10);
    if(T===0||T===4)return m[1]?'太秦天神川':'京都市役所前';

/* 離合：逆向きの列車と、駅で重なる（同じ駅に同時にいる）か、駅と駅の間で線が交わるところ */
const meetCache=new WeakMap();
function meetIndex(d){
  let m=meetCache.get(d);if(m&&m.ver===autoVer)return m;
  m={ver:autoVer,seg:new Map(),st:new Map(),pts:new Map()};
  [[1,d.kudari],[-1,d.nobori]].forEach(([dir,list])=>list.forEach(t=>{
    const ps=tpoints(t);m.pts.set(t,{dir,ps});
    ps.forEach((p,k)=>{
      (m.st.get(p.st)||m.st.set(p.st,[]).get(p.st)).push({t,dir,a:p.A,d:p.D});
      if(k>0&&ps[k-1].bi===p.bi){
        const q=ps[k-1],key=Math.min(q.st,p.st)+'-'+Math.max(q.st,p.st);
        (m.seg.get(key)||m.seg.set(key,[]).get(key)).push({t,dir,from:q,to:p});
      }
    });
  }));
  meetCache.set(d,m);return m;
}
function meetingsFor(t,d){
  const m=meetIndex(d),info=m.pts.get(t),atSt=new Map(),between=new Map();
  const lk=d.links||[];
  if(!info)return {atSt,between};
  const seen=new Set(),add=(map,key,o,tm)=>{const id=key+'|'+o.id;if(seen.has(id))return;seen.add(id);(map.get(key)||map.set(key,[]).get(key)).push({no:o.no||'（番号なし）',tm})};
  info.ps.forEach((p,k)=>{
    (m.st.get(p.st)||[]).forEach(o=>{
      if(o.dir===info.dir||o.t===t)return;
      if(lk.some(l=>(l.a===t.id&&l.b===o.t.id)||(l.a===o.t.id&&l.b===t.id)))return; // 折返しでつながっている2本は、離合ではない
      if(Math.min(p.D,o.d)-Math.max(p.A,o.a)>=-1/120)add(atSt,p.st,o.t,Math.max(p.A,o.a));
    });
    if(k>0&&info.ps[k-1].bi===p.bi){
      const q=info.ps[k-1],key=Math.min(q.st,p.st)+'-'+Math.max(q.st,p.st);
      (m.seg.get(key)||[]).forEach(o=>{
        if(o.dir===info.dir||o.t===t||o.from.st!==p.st||o.to.st!==q.st)return;
        const x0=q.D,x1=p.A,y0=o.from.D,y1=o.to.A,L=Math.max(x0,y0),U=Math.min(x1,y1);
        if(U<=L)return;
        const cl=(v,a,b)=>Math.min(Math.max(v,a),b),fx=v=>(cl(v,x0,x1)-x0)/((x1-x0)||1),fy=v=>1-(cl(v,y0,y1)-y0)/((y1-y0)||1);
        if(fx(L)-fy(L)<-1e-6&&fx(U)-fy(U)>1e-6)add(between,q.st+'>'+p.st,o.t,L);
      });
    }
  });
  atSt.forEach(v=>v.sort((x,y)=>x.tm-y.tm));between.forEach(v=>v.sort((x,y)=>x.tm-y.tm));
  return {atSt,between};
}

    else if(pass)tag='通過';
    else if(x.a!=null&&x.d!=null&&Math.round(x.d*60)-Math.round(x.a*60)>=60)sub=`着 ${hm(x.a).s}`;

    let html=`<div class="ts-st${pass?' ts-pass':''}"><div class="ts-time">${timeHtml(main)}${tag?`<span class="ts-tag">${tag}</span>`:''}</div><div class="ts-node"><i></i></div><div class="ts-name">${esc(dispSt(x.i))}${sub?`<span class="ts-sub">${sub}</span>`:''}${ms}</div><div class="ts-trk">${trk}</div></div>`;
    if(!last){

    <div class="ts-head"><div class="ts-row1">${special?`<span class="ts-badge" style="background:${badge}">${esc(ty.n)}</span>`:''}<span class="ts-dest">${esc(destName)}<small>行</small></span></div>

    <div class="ts-meta">${first?`<div><span class="ts-chip">区間</span>${esc(dispSt(first.i))} ${hm(first.d??first.a).s} → ${esc(dispSt(last.i))} ${hm(last.a??last.d).s}</div>`:''}
    ${unit?`<div><span class="ts-chip">運用</span>${lineName(ln)} ${esc(unit)}</div>`:''}</div></div>
    <div class="ts-list">${rows||'<div style="padding:16px;color:#777">時刻がありません</div>'}</div></div>`;
  ov.classList.add('on');
  const card=ov.querySelector('.ts-card');if(card)card.scrollTop=0;
}

/* ---------- 画像・印刷（複数枚・高解像度） ---------- */
const PAPERS={A4:{w:297,h:210,n:'A4 横'},A3:{w:420,h:297,n:'A3 横'},B4:{w:364,h:257,n:'B4 横'},free:{n:'用紙に合わせない（1枚ずつ原寸）'}};

function trainRange(){
  let lo=1e9,hi=-1e9;
  const d=curDia();[...d.kudari,...d.nobori].forEach(t=>{const s=trainSpan(t);if(s){lo=Math.min(lo,s.lo);hi=Math.max(hi,s.hi)}});
  return lo>hi?null:[Math.floor(lo/60),Math.ceil(hi/60)];
}
const hmT=m=>`${Math.floor(m/60)%24}:${pad(Math.round(m%60))}`;
function exportGeom(e){
  const free=e.paper==='free',P=PAPERS[e.paper],m=8;
  const base=layout(),Hc=base.H,gridX=layout({left:true}).gridX;
  const T=(e.ex1-e.ex0)*60,span=(e.span==='all'?(e.ex1-e.ex0):+e.span)*60;
  const single=span>=T-1e-9, t0=e.ex0*60;
  let ppm=S.ppm,Wc=null,mmPerPx=null;
  const plan=[];
  if(!free){
    const aw=P.w-2*m,ah=P.h-2*m;mmPerPx=ah/Hc;Wc=aw/mmPerPx;
    if(single){
      ppm=(Wc-gridX-RW)/T;plan.push({left:1,right:1,t0,t1:t0+T});
    }else{
      // 用紙の枚数を決め、全ページが隙間なくぴったり埋まるよう線の間隔を少しだけ調整する
      const ppm0=(Wc-gridX)/span;
      const N=Math.max(2,Math.round((T*ppm0+gridX+RW)/Wc));
      ppm=(N*Wc-gridX-RW)/T;
      let t=t0;
      for(let k=0;k<N;k++){
        const w=k===0?Wc-gridX:(k===N-1?Wc-RW:Wc),dt=w/ppm;
        plan.push({left:k===0?1:0,right:k===N-1?1:0,t0:t,t1:t+dt});t+=dt;
      }
    }
  }else{
    const n=single?1:Math.ceil(T/span-1e-9);
    for(let k=0;k<n;k++)plan.push({left:k===0?1:0,right:k===n-1?1:0,t0:t0+k*span,t1:t0+(k+1)*span});
  }
  return {free,P,m,Hc,gridX,Wc,mmPerPx,ppm,plan};
}

function crc32(u8){
  if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c>>>0}}
  let crc=0xFFFFFFFF;for(let i=0;i<u8.length;i++)crc=crc32.t[(crc^u8[i])&255]^(crc>>>8);return (crc^0xFFFFFFFF)>>>0;
}
function makeZip(files){ // 無圧縮のZIP。iPadの「ファイル」アプリでタップするだけで開ける
  const enc=new TextEncoder(),chunks=[],central=[];let off=0;
  const d=new Date(),dosT=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dosD=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(f=>{
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(dosT),...u16(dosD),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    chunks.push(lh,nm,f.data);central.push({nm,crc,sz,off});off+=lh.length+nm.length+sz;
  });
  const cdStart=off;
  central.forEach(c=>{
    const ch=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(dosT),...u16(dosD),...u32(c.crc),...u32(c.sz),...u32(c.sz),...u16(c.nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(c.off)]);
    chunks.push(ch,c.nm);off+=ch.length+c.nm.length;
  });
  chunks.push(new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(central.length),...u16(central.length),...u32(off-cdStart),...u32(cdStart),...u16(0)]));
  return new Blob(chunks,{type:'application/zip'});
}

function sfApply(t){
  const txt=$('#sf_txt').value,sf={},errs=[],warn=[];
  txt.split(/\n/).forEach((line,i)=>{
    line=_nd(line).trim();if(!line)return;
    const tk=line.split(/[\s,、，]+/).filter(Boolean),nm=tk.shift(),ts=[];
    const idxs=S.stations.map((x,j)=>j).filter(j=>S.stations[j].n===nm||S.stations[j].disp===nm);
    if(!idxs.length){errs.push(`${i+1}行目：駅「${nm}」がありません。`);return}
    const idx=idxs.find(j=>t.c[j]&&t.c[j].m>0)??idxs.find(j=>t.c[j]);
    if(idx==null||!t.c[idx]){errs.push(`${i+1}行目：この列車は「${nm}」に停車・通過しません。`);return}
    let a=null,d=null;const un=[];let bad=false;
    tk.forEach(w=>{
      const m=/^(着|発)?[:：]?(.+)$/.exec(w);if(!m){bad=true;return}
      const v=parseT(m[2]);if(v==null){bad=true;return}
      if(m[1]==='着')a=v;else if(m[1]==='発')d=v;else un.push(v);
    });
    if(bad||(!un.length&&a==null&&d==null)){errs.push(`${i+1}行目：時刻が読み取れません（例 5:07:45）。`);return}
    const c=t.c[idx];

    const e={};if(a!=null)e.a=a;if(d!=null)e.d=d;sf[idx]=e;
    [[a,c.a??c.d],[d,c.d??c.a]].forEach(q=>{if(q[0]!=null&&q[1]!=null&&Math.abs(q[0]-q[1])>5&&!warn.includes(nm))warn.push(nm)});
  });
  if(errs.length){sfDraft={id:t.id,text:txt};sfMsg='反映できませんでした。\n'+errs.join('\n');renderTrains();return}
  sfDraft=null;

}

function bulkSave(){
  const t=bm.t, rows=$$('#bmBody .brow');
  const nc=new Array(N()).fill(null);let out=null,inn=null;
  for(const r of rows){
    const i=+r.dataset.si,m=+r.dataset.m;
    if(r.querySelector('.bo').checked&&out==null)out=i;
    if(r.querySelector('.bi').checked&&inn==null)inn=i;
    if(m===0)continue;
    const va=r.querySelector('.ba').value.trim(),vd=r.querySelector('.bd').value.trim();
    const a=va?parseT(va):null,d=vd?parseT(vd):null;
    if((va&&a==null)||(vd&&d==null)){uiAlert(`「${S.stations[i].n}」の時刻の形式が正しくありません（例 5:30:00）`);return}
    if(a!=null&&d!=null&&d<a){uiAlert(`「${S.stations[i].n}」の発時刻が着時刻より前になっています`);return}
    nc[i]={m,a,d,t:r.querySelector('.bt').value.trim()};
  }
  t.c=nc;t.no=$('#bm_no').value.trim();t.type=+$('#bm_type').value;t.staff=$('#bm_staff').checked;if(hasSec(t))t.staff=true;
  if(out!==bm.em.out)t.out=out==null?false:out;
  if(inn!==bm.em.inn)t.inn=inn==null?false:inn;
  const dia=curDia(),list=bm.kind===1?dia.kudari:dia.nobori;
  if(bm.isNew){list.push(t);}
  else{const i=list.findIndex(x=>x.id===bm.orig.id);if(i>=0)list[i]=t;}
  S.sel=t.id;
  $('#bm').classList.remove('on');bm=null;
  refreshViews();redraw();
}

function unitAssign(){
  const d=curDia(),all=[...d.kudari,...d.nobori].map(t=>({t,s:trainSpan(t)})).filter(x=>x.s);
  all.sort((a,b)=>a.s.lo-b.s.lo);
  const chains=[];
  all.forEach(x=>{
    let best=null,bg=1e9;
    chains.forEach(ch=>{
      const l=ch[ch.length-1];
      if(!sameSt(l.s.s1,x.s.s0)||lineOf(l.t)!==lineOf(x.t))return;
      const g=x.s.lo-l.s.hi;
      if(g>=0&&g<=90&&g<bg){bg=g;best=ch}
    });
    if(best)best.push(x);else chains.push([x]);
  });
  all.forEach(x=>x.t.unit='');
  const cnt={I:0,K:0};
  chains.forEach(ch=>{const k=pad(++cnt[lineOf(ch[0].t)]);ch.forEach(x=>x.t.unit=k)});
}
let unq='',unMsg='',lkMsg='',lkBulk='',sfMsg='',sfDraft=null;const unSel=new Set();
const normNo=x=>_nd(String(x||'')).trim().toLowerCase();

const ishiBlocks=()=>{const b=S.blocks.filter(x=>/石山坂本/.test(x.label||''));if(!b.length&&S.blocks[0])b.push(S.blocks[0]);return b};
function lineOf(t){return ishiBlocks().some(b=>t.c.some((c,i)=>c&&(c.a!=null||c.d!=null)&&i>=b.from&&i<=b.to))?'I':'K'}
const lineName=l=>l==='I'?'石山坂本線':'京津線';
const lineTag=t=>lineOf(t)==='I'?'石':'京';
function unitKeys(d,line){const st=new Set();trainsOfDia(d).forEach(t=>{if(line&&lineOf(t)!==line)return;const k=(t.unit||'').trim();if(k)st.add(k)});return [...st].sort((x,y)=>x.localeCompare(y,'ja',{numeric:true}))}
function freeUnitKey(d,line){const used=new Set(unitKeys(d,line));let n=1;while(used.has(pad(n)))n++;return pad(n)}
function noCore(x){return _nd(String(x||'')).trim().toLowerCase().replace(/^[a-z]+/,'')}
function miList(){return _nd(S.miTurn||'').split(/[\s,、，]+/).map(noCore).filter(Boolean)}
/* ダイヤごとの、図の左の枠の名前と改正年月。名前を付けていなければ、ダイヤ名の最初の言葉（「平日　20221219」なら「平日」）、改正年月は全体の設定を使う */
function dayLabel(d){const l=d&&d.label&&String(d.label).trim();return l||String((d&&d.name)||'').split(/[\s\u3000]+/)[0]||S.day||''}
function revText(d){return d&&d.rev!=null&&String(d.rev)!==''?String(d.rev):S.rev}
function stBase(i){return ((S.stations[i]&&S.stations[i].n)||'').replace(/[（(][^）)]*[）)]/g,'')}
function sameSt(a,b){return a===b||(stBase(a)!==''&&stBase(a)===stBase(b))} // 浜大津 と 浜大津（京津）などは同じ駅として扱う
function effEnd(t){return t.realEnd||(miList().includes(noCore(t.no))?'M':(S.ksTerm||'C'))}
function isThrough(ta,tb,st){ // 御陵：地下鉄（東西線）へ直通する列車どうしのつなぎ＝御陵での折返しではない
  return S.stations[st]&&S.stations[st].n==='御陵'&&effEnd(ta)!=='M'&&effEnd(tb)!=='M';
}
function setLink(d,a,b){ // 1本の「次」は1本だけ、1本の「前」も1本だけ
  d.links=d.links||[];
  if(d.links.some(l=>l.a===a&&l.b===b))return false;
  d.links=d.links.filter(l=>l.a!==a&&l.b!==b);d.links.push({a,b});return true;
}
function linkUnit(d,key,line){ // 運用の中を時刻順に見て、折返し駅が同じものどうしをつなぐ
  const xs=trainsOfDia(d).filter(t=>(t.unit||'').trim()===key&&(!line||lineOf(t)===line)).map(t=>({t,s:trainSpan(t)})).filter(x=>x.s).sort((p,q)=>p.s.lo-q.s.lo);
  let add=0,skip=0;
  for(let i=1;i<xs.length;i++){
    if(!sameSt(xs[i-1].s.s1,xs[i].s.s0)){skip++;continue}
    if(setLink(d,xs[i-1].t.id,xs[i].t.id))add++;
  }
  return {add,skip};
}
function syncUnit(d,ta,tb){ // つないだ2本を同じ運用番号にそろえる（同じ路線どうしのときだけ）
  if(lineOf(ta)!==lineOf(tb))return '（路線がちがうので、運用番号は別々のままです）';
  const ln=lineOf(ta),ua=(ta.unit||'').trim(),ub=(tb.unit||'').trim();
  if(!ua&&!ub){const k=freeUnitKey(d,ln);ta.unit=tb.unit=k;return `${lineName(ln)}の運用 ${k} として登録しました。`}
  if(ua&&!ub){tb.unit=ua;return `${lineName(ln)}の運用 ${ua} に入れました。`}
  if(!ua&&ub){ta.unit=ub;return `${lineName(ln)}の運用 ${ub} に入れました。`}
  if(ua!==ub){trainsOfDia(d).forEach(t=>{if(lineOf(t)===ln&&(t.unit||'').trim()===ub)t.unit=ua});return `${lineName(ln)}の運用 ${ub} を運用 ${ua} にまとめました。`}
  return '';
}

function linkPair(d,na,nb){ // 列車番号を完全に入力して1組をつなぐ。戻り値 {err}|{ta,tb,note}
  const xs=trainsOfDia(d),fa=xs.filter(t=>normNo(t.no)===normNo(na)),fb=xs.filter(t=>normNo(t.no)===normNo(nb));
  if(!fa.length)return {err:`「${na}」という列車番号は、このダイヤにありません。`};
  if(!fb.length)return {err:`「${nb}」という列車番号は、このダイヤにありません。`};
  let best=null;
  fa.forEach(ta=>fb.forEach(tb=>{
    if(ta===tb)return;const sa=trainSpan(ta),sb=trainSpan(tb);if(!sa||!sb)return;
    const ok=sameSt(sa.s1,sb.s0)&&sb.lo>=sa.hi,score=(ok?0:1e6)+Math.abs(sb.lo-sa.hi);
    if(!best||score<best.score)best={ta,tb,score,sa,sb};
  }));
  if(!best)return {err:fa[0]===fb[0]?`「${na}」を自分自身にはつなげません。`:`「${na}」「${nb}」のどちらかに時刻が入っていません。`};
  const {ta,tb,sa,sb}=best;
  setLink(d,ta.id,tb.id);
  let note=syncUnit(d,ta,tb);
  if(!sameSt(sa.s1,sb.s0))note+=`（注意：終着 ${shortName(sa.s1)} と始発 ${shortName(sb.s0)} が違います）`;
  else if(sb.lo<sa.hi)note+='（注意：時間が重なっています）';
  return {ta,tb,note};
}

      <div class="gbar" aria-hidden="true">${ts.map(x=>x.s?`<i style="left:${Math.max(0,(x.s.lo-D0)/(D1-D0)*100)}%;width:${Math.max(.4,(x.s.hi-x.s.lo)/(D1-D0)*100)}%"></i>`:'').join('')}</div><table>`;
      let prev=null;
      ts.forEach(x=>{
        const t=x.t,s=x.s,rm=k!==''?`<td style="width:56px"><button class="sm" data-act="usrm" data-id="${t.id}" aria-label="この運用から外す">外す</button></td>`:'<td style="width:0"></td>';
        if(!s){h+=`<tr><td>${esc(trainName(t))}</td><td colspan="3" class="hint">時刻が未入力</td>${rm}</tr>`;return}
        let gap='';
        if(prev){
          const g=s.lo-prev.s.hi,lk=(d.links||[]).some(l=>l.a===prev.t.id&&l.b===t.id)?'　🔗つなぎ済':'';
          if(!sameSt(prev.s.s1,s.s0))gap=`<span class="gap warn">折返し駅が違います（${esc(shortName(prev.s.s1))}→${esc(shortName(s.s0))}）</span>`;
          else if(g<0)gap=`<span class="gap warn">時間が重なっています（${dur(g)}）</span>`;
          else gap=`<span class="gap ok">折返し ${dur(g)}${lk}</span>`;
        }
        h+=`<tr><td style="white-space:nowrap"><b>${esc(trainName(t))}</b></td><td style="white-space:nowrap">${esc(shortName(s.s0))} ${fmtC(s.lo)} → ${esc(shortName(s.s1))} ${fmtC(s.hi)}</td><td>${gap}</td><td style="width:84px"><input type="text" inputmode="numeric" data-tid="${t.id}" data-f="unit" value="${esc(t.unit)}" aria-label="この列車の運用番号"></td>${rm}</tr>`;
        prev=x;
      });
      h+='</table></div>';
    });
  });
  h+='</div></div>';
  $('#unpage').innerHTML=h;
}

}
function stationDelete(i){
  if(N()<=2){uiAlert('駅は2つ以上必要です');return false}
  S.stations.splice(i,1);
  S.dias.forEach(d=>[...d.kudari,...d.nobori].forEach(t=>t.c.splice(i,1)));
  S.blocks.forEach(b=>{if(b.from>i)b.from--;if(b.to>=i)b.to--});
  S.blocks=S.blocks.filter(b=>b.to>=b.from);
  if(!S.blocks.length)S.blocks=guessBlocks(S.stations);
  return true;
}

/* ---------- OuDia の取り込み・書き出し ---------- */
const staffKey=(dn,kind,x)=>{const s=trainSpan(x);return `${dn}|${kind}|${x.no}|${s?s.lo+'@'+s.s0:'-'}`};
function importOud(text,fileName){
  const D=parseOud(text);
  const staffKeys=new Set();
  S.dias.forEach(d=>{d.kudari.forEach(x=>{if(x.staff)staffKeys.add(staffKey(d.name,1,x))});d.nobori.forEach(x=>{if(x.staff)staffKeys.add(staffKey(d.name,-1,x))})});
  if(!D.stations.length)throw new Error('駅がありません');
  const oldBy=new Map();S.stations.forEach(s=>oldBy.set(s.n,s));
  const b=baseState();
  const stations=D.stations.map((s,i)=>{
    const old=oldBy.get(s.n);
    const o=Object.assign({},old||{},{ex:s.ex});
    if(!old&&!BOOK[s.n]){ // 初めての駅名：距離から区間・累計を計算
      o.iv=i>0?(D.stations[i-1].dist/1000).toFixed(1):'';
      let c=0;for(let k=0;k<i;k++)c+=D.stations[k].dist;o.cum=(c/1000).toFixed(1);o.gr='';o.disp='';o.mark=0;o.hide=0;
    }
    return stationObj(s.n,s.dist,o);
  });
  nextId=1;
  const idm={};
  D.dias.forEach(d=>[...d.kudari,...d.nobori].forEach(t=>{const n=nextId++;idm[t.id]=n;t.id=n}));
  D.dias.forEach(d=>{d.links=(d.links||[]).map(l=>({a:idm[l.a],b:idm[l.b]}))});
  const blocks=(stations.length===S.stations.length&&stations.every((s,i)=>s.n===S.stations[i].n))?S.blocks:guessBlocks(stations);
  const n=Object.assign(S,{
    stations,types:D.types.length?D.types:DEF_TYPES(),dias:D.dias.length?D.dias:b.dias,di:0,sel:null,blocks,
    uid:newUid(),legacy:false,rosen:D.rosen,fileType:D.fileType,rootEx:D.rootEx,rosenEx:D.rosenEx,
    fileName:(fileName||'').replace(/\.(oud|json)(\.txt)?$/i,''),name:(fileName||S.name).replace(/\.(oud|json)(\.txt)?$/i,'')
  });
  S=normalize(n);
  applyFrameMeta(S.rosenEx);
  if(staffKeys.size)S.dias.forEach(d=>{d.kudari.forEach(x=>{if(staffKeys.has(staffKey(d.name,1,x)))x.staff=true});d.nobori.forEach(x=>{if(staffKeys.has(staffKey(d.name,-1,x)))x.staff=true})});
}
function frameMeta(){ // 図の枠の文字（題名・No.・改正年月・記事・ダイヤごとの枠名と改正年月）
  return {title:S.title,no:S.no,rev:S.rev,note:S.note,credit:S.credit,dias:S.dias.map(d=>({name:d.name,label:d.label||'',rev:d.rev==null?'':d.rev}))};
}
function applyFrameMeta(rosenEx){ // 〔図:…〕の印から、枠の文字を元に戻す（見つからなければ、何もしない）
  const cm=(rosenEx||[]).find(p=>p[0]==='Comment');
  if(!cm||typeof cm[1]!=='string')return;
  const m=/〔図:([^〕]*)〕/.exec(cm[1]);if(!m)return;
  try{
    const M=JSON.parse(decodeURIComponent(m[1]));
    ['title','no','rev','note','credit'].forEach(k=>{if(typeof M[k]==='string')S[k]=M[k]});
    (M.dias||[]).forEach((x,i)=>{const d=S.dias[i];if(d&&d.name===x.name){if(x.label)d.label=x.label;if(x.rev)d.rev=x.rev}});
  }catch(e){}
  cm[1]=cm[1].replace(/〔図:[^〕]*〕/g,'');
}
function exportOudText(){
  return writeOud({fileType:S.fileType||'OuDia.1',rootEx:S.rootEx||[],rosen:S.rosen,rosenEx:S.rosenEx||[],
    stations:S.stations.map(s=>({n:s.n,dist:s.dist,ex:s.ex||[]})),types:S.types,dias:S.dias,meta:frameMeta()});
}

/* ファイルを開く */
async function unzipOud(buf){ // ZIPの中の .oud を取り出す（無圧縮・deflateどちらも可）
  const u=new Uint8Array(buf),dv=new DataView(buf);
  let e=-1;for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('zip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(/\.oud$/i.test(name)&&!/__MACOSX|\/\._/.test(name)){
      const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u.subarray(ds,ds+csz);
      if(method===0)return {name,text:decodeText(raw)};
      if(method===8){const d=new DecompressionStream('deflate-raw'),w=d.writable.getWriter();w.write(raw);w.close();return {name,text:decodeText(await new Response(d.readable).arrayBuffer())}}
    }
  }
  throw new Error('no oud');
}
async function openFileText(text,fname){
  try{
    if(/\.oud(\.txt)?$/i.test(fname)||/^\uFEFF?\s*FileType=OuDia/.test(text)){
      if(!await uiConfirm('「'+fname+'」を開きます。いまの列車データは置き換わります（図の表示設定は引き継ぎます）。よろしいですか？'))return;
      importOud(text.replace(/^\uFEFF/,''),fname);tt={tid:null,si:null};renderAll();redraw();showView(curView);
    }else{
      const o=JSON.parse(text);if(!o||!o.dias)throw new Error('format');
      if(await uiConfirm('「'+fname+'」を開きます。いまの内容は置き換わります。よろしいですか？'))applyState(o);
    }
  }catch(err){uiAlert('このファイルは読み込めませんでした。OuDiaの .oud（ZIPに入れたものも可）か、このサイトのJSON保存のファイルを選んでください。')}
}
$('#fileIn').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  e.target.value='';
  try{
    if(/\.zip$/i.test(file.name)){const z=await unzipOud(await file.arrayBuffer());await openFileText(z.text,z.name)}
    else await openFileText(decodeText(await file.arrayBuffer()),file.name);
  }catch(err){uiAlert('このファイルは読み込めませんでした。OuDiaの .oud（ZIPに入れたものも可）か、このサイトのJSON保存のファイルを選んでください。')}
});

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='fl_q'){fl.q=el.value;$('#tlist').innerHTML=listHtml();return}
  if(el.id==='lk_bulk'){lkBulk=el.value;return}
  if(el.id==='us_q'){unq=el.value;$('#us_res').innerHTML=unResHtml();return}
  if(el.closest('#p-set')&&el.dataset.s){
    const k=el.dataset.s;
    if(k==='sec6')S.sec6=el.value==='1';
    else if(k==='useTypeColor')S.useTypeColor=el.value==='1';
    else if(k==='termDOff')S.termDOff=el.value==='1';
    else if(k==='crossStyle')S.crossStyle=el.value;
    else if(k==='day')curDia().label=el.value;
    else if(k==='rev')curDia().rev=el.value;
    else S[k]=(el.type==='number'||el.type==='range')?(parseFloat(el.value)||0):el.value;
    if(k==='startHour'||k==='endHour'||k==='startMin'||k==='endMin'){
      S.startHour=Math.max(3,Math.min(25,Math.round(S.startHour)));
      S.endHour=Math.max(S.startHour,Math.min(27,Math.round(S.endHour)));
      S.startMin=Math.max(0,Math.min(59,Math.round(S.startMin||0)));
      S.endMin=Math.max(0,Math.min(59,Math.round(S.endMin||0)));

});
