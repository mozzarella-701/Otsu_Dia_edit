/* ===== 臨時ダイヤPDF（時刻表形式）の読み取り：文字の座標から「駅の行 × 列車の列」を復元する ===== */
const _nd=s=>String(s||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
function splitTimes(it){
  const s=_nd(it.str),out=[],re=/(\d{1,2}):(\d{2})/g,len=Math.max(s.length,1);let m;
  while((m=re.exec(s)))out.push({text:m[0],x:it.x+(it.w||0)*((m.index+m[0].length/2)/len),y:it.y});
  return out;
}
function cleanStationLabel(s){
  return _nd(s).replace(/[\s\u3000]+/g,'').replace(/[（(]\s*[着発着発]\s*[）)]/g,'').replace(/[（(][^）)]*[）)]/g,m=>/着|発/.test(m)?'':m);
}
function parsePdfPage(items){
  const times=[],labels=[];
  items.forEach(it=>{
    const tk=splitTimes(it);
    if(tk.length)times.push(...tk);
    else if(String(it.str||'').trim())labels.push({s:String(it.str).trim(),x:it.x,y:it.y,w:it.w||0});
  });
  if(!times.length)return null;
  const warn=[];
  const minX=Math.min(...times.map(t=>t.x));
  const yLo=Math.min(...times.map(t=>t.y))-9,yHi=Math.max(...times.map(t=>t.y))+9;
  // 駅名の行：時刻より左にある文字を、y座標でまとめる
  const nm=labels.filter(l=>l.x<minX-14&&l.y>=yLo&&l.y<=yHi).sort((a,b)=>a.y-b.y);
  const rows=[];
  nm.forEach(l=>{
    const r=rows.find(r=>Math.abs(r.y-l.y)<=5);
    if(r){r.items.push(l);r.y=(r.y*(r.items.length-1)+l.y)/r.items.length}else rows.push({y:l.y,items:[l]});
  });
  rows.sort((a,b)=>a.y-b.y);
  rows.forEach(r=>{r.name=cleanStationLabel(r.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(''))});
  if(rows.length<2){warn.push('駅名の行を読み取れませんでした');return {rows:[],trains:[],warn}}
  const pitch=rows.length>1?(rows[rows.length-1].y-rows[0].y)/(rows.length-1):17;
  // 列：時刻の中心x座標でまとめる
  const sx=[...times].sort((a,b)=>a.x-b.x),cols=[];
  sx.forEach(t=>{const c=cols[cols.length-1];if(c&&t.x-c.mean<=14){c.items.push(t);c.mean=c.items.reduce((s,i)=>s+i.x,0)/c.items.length}else cols.push({mean:t.x,items:[t]})});
  let dropped=0;
  const trains=cols.map((c,ci)=>{
    const pts=[],seen=new Set();
    c.items.forEach(t=>{
      let bi=-1,bd=1e9;rows.forEach((r,i)=>{const d=Math.abs(r.y-t.y);if(d<bd){bd=d;bi=i}});
      if(bd>pitch*0.7){dropped++;return}
      if(seen.has(bi)){warn.push(`同じ駅に時刻が2つあります（列${ci+1}・${rows[bi].name}）`);return}
      seen.add(bi);pts.push({row:bi,name:rows[bi].name,text:t.text});
    });
    pts.sort((a,b)=>a.row-b.row);
    return {col:ci,pts};
  }).filter(t=>t.pts.length>=2);
  if(dropped)warn.push(`行に対応づけられない時刻が ${dropped} 個ありました`);
  return {rows:rows.map(r=>r.name),trains,warn};
}
function parsePdfPages(pagesItems){
  const out={date:'',pages:[],trains:[],warn:[]};
  pagesItems.forEach((items,pi)=>{
    if(!out.date){const all=items.map(i=>_nd(i.str)).join(' ');const m=all.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/);if(m)out.date=`${+m[1]}月${+m[2]}日`}
    const r=parsePdfPage(items);
    if(!r){out.warn.push(`${pi+1}ページ目に時刻が見つかりません`);return}
    r.warn.forEach(w=>out.warn.push(`${pi+1}ページ目：${w}`));
    out.pages.push({rows:r.rows,count:r.trains.length});
    r.trains.forEach(t=>out.trains.push({page:pi+1,col:t.col,pts:t.pts}));
  });
  return out;
}

/* ---------- 臨時ダイヤ取り込み（PDF）と列番の自動付与 ---------- */
const TOZAI=['蹴上','東山','三条京阪','京都市役所前','烏丸御池','二条城前','二条','西大路御池','太秦天神川']; // 京都市営地下鉄（データには取り込まない）
const KS_NAMES=new Set(['上栄町','大谷','追分','四宮','京阪山科','御陵',...TOZAI]);
const IS_NAMES=new Set(['石山寺','唐橋前','京阪石山','粟津','瓦ヶ浜','中ノ庄','膳所本町','錦','京阪膳所','石場','島ノ関','三井寺','別所','皇子山','近江神宮前','南滋賀','滋賀里','穴太','松ノ馬場','坂本','坂本比叡山口','大津市役所前','京阪大津京']);
const NUM_RULES=[ // 始発・終着の駅（順不同）→ 列番の十の位（T）と、頭に C を付けるか
  {a:'浜大津（京津）',b:'京都市役所前',T:0,C:false},{a:'浜大津（京津）',b:'太秦天神川',T:0,C:true},
  {a:'浜大津（京津）',b:'御陵',T:2},{a:'浜大津（京津）',b:'四宮',T:3},
  {a:'四宮',b:'京都市役所前',T:4,C:false},{a:'四宮',b:'太秦天神川',T:4,C:true},{a:'四宮',b:'御陵',T:5},
  {a:'石山寺',b:'坂本',T:6},{a:'近江神宮前',b:'坂本',T:7},{a:'石山寺',b:'近江神宮前',T:8},{a:'石山寺',b:'浜大津',T:8},{a:'浜大津',b:'近江神宮前',T:9}];
const STN_ALIAS={'大津市役所前':'別所','京阪大津京':'皇子山','びわ湖浜大津':'浜大津','坂本比叡山口':'坂本'}; // PDF側の駅名 → データの駅名
const NUM_ALIAS={...STN_ALIAS,'錦織出庫待機':'近江神宮前'};
function numSection(o,d){
  o=NUM_ALIAS[o]||o;d=NUM_ALIAS[d]||d;
  return NUM_RULES.find(r=>(r.a===o&&r.b===d)||(r.a===d&&r.b===o))||null;
}
/* 列番：[頭文字][出発の時2桁][十の位][一の位]。下り＝奇数・上り＝偶数。使われていない最小のものを選ぶ。
   京津線は、09の次は 11,13,15…（上りは 08の次は 10,12,14…）と続ける。石山坂本線は5本を超えたら頭にA */
function assignNumber(o,d,startMin,kind,used,prefixBase,keep){
  const sec=numSection(o,d);if(!sec)return {no:'',warn:'この区間の付番ルールがありません'};
  return assignNumberSec(sec,startMin,kind,used,prefixBase,null,keep);
}
function assignNumberSec(sec,startMin,kind,used,prefixBase,hhFixed,keep){
  const hh=hhFixed||pad(Math.floor(startMin/60)%24),pre=(prefixBase||'')+(sec.C?'C':''),base=kind>0?1:0;
  if(keep){ // いまの番号がすでにルールどおりなら、そのまま残す（一の位などを勝手に変えない）
    for(const p of (sec.T>=6?[pre,pre+'A']:[pre])){
      const m=keep.match(new RegExp('^'+p+hh+'(\\d\\d)$'));
      if(m){const n=+m[1];if(sec.T>=6?(Math.floor(n/10)===sec.T&&n%2===base):(n>=sec.T*10&&n%2===base))return {no:keep,warn:''}}
    }
  }
  if(sec.T>=6){
    for(const p of [pre,pre+'A'])for(let u=base;u<=9;u+=2){
      const no=`${p}${hh}${sec.T}${u}`;
      if(!used.has(no)){used.add(no);return {no,warn:p!==pre?'同じ時間帯が6本以上のため頭にAを付けました':''}}
    }
  }else{
    for(let n=sec.T*10+base;n<=99;n+=2){
      const no=`${pre}${hh}${pad(n)}`;
      if(!used.has(no)){used.add(no);return {no,warn:''}}
    }
  }
  return {no:'',warn:'番号を使い切りました（手で付けてください）'};
}
function dataNumbers(dia,exceptId){const s=new Set();if(!dia)return s;[...dia.kudari,...dia.nobori].forEach(t=>{if(t.id!==exceptId&&t.no)s.add(t.no)});return s}

/* 駅名の突き合わせ */
function resolveNames(names){
  const ks=names.some(n=>KS_NAMES.has(n)),is=names.some(n=>IS_NAMES.has(n));
  const res={};
  names.forEach(raw=>{
    const n=STN_ALIAS[raw]||raw.replace(/^びわ湖/,'');let idx=-1;
    if(n==='浜大津'){
      const c=S.stations.map((s,i)=>s.n.startsWith('浜大津')?i:-1).filter(i=>i>=0);
      idx=(ks&&!is)?(c.find(i=>S.stations[i].n.includes('京津'))??c[0]??-1):(is&&!ks?(c.find(i=>!S.stations[i].n.includes('京津'))??c[0]??-1):(c[0]??-1));
    }else{
      idx=S.stations.findIndex(s=>s.n===n);
      if(idx<0){const c=S.stations.map((s,i)=>(n.length>=2&&(s.n.includes(n)||n.includes(s.n)))?i:-1).filter(i=>i>=0);if(c.length===1)idx=c[0]}
    }
    if(idx>=0)res[raw]={status:'ok',idx,dn:S.stations[idx].n};
    else if(TOZAI.includes(n))res[raw]={status:'tozai',dn:n};
    else res[raw]={status:'unknown',dn:n};
  });
  return res;
}

/* PDFの読み込み */
async function loadPdfjs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/';
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src=base+'pdf.min.js';s.onload=res;s.onerror=()=>rej(new Error('pdfjs'));document.head.appendChild(s)});
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
  return window.pdfjsLib;
}
async function pdfItems(buf){
  const lib=await loadPdfjs();
  const doc=await lib.getDocument({data:new Uint8Array(buf)}).promise;
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i),vp=pg.getViewport({scale:1}),tc=await pg.getTextContent();
    pages.push(tc.items.filter(it=>it.str!==undefined).map(it=>({str:it.str,x:it.transform[4],y:vp.height-it.transform[5],w:it.width})));
  }
  return pages;
}

function mergeParsed(list){
  const out={date:'',pages:[],trains:[],warn:[]};
  list.forEach(({name,parsed},fi)=>{
    if(!out.date&&parsed.date)out.date=parsed.date;
    out.pages.push(...parsed.pages);
    parsed.warn.forEach(w=>out.warn.push(list.length>1?`${name}：${w}`:w));
    parsed.trains.forEach(t=>out.trains.push({...t,file:fi}));
  });
  return out;
}
async function impFromFiles(files){
  const msg=$('#impMsg');if(msg)msg.textContent='読み取り中…';
  const list=[];
  for(const f of files){
    let pages;
    try{pages=await pdfItems(await f.arrayBuffer())}
    catch(e){if(msg)msg.innerHTML='<span style="color:var(--warn)">PDFを読み込めませんでした。PDFを読み取る部品が読み込めない、または対応していない形式のPDFです（インターネット接続も確認してください）。</span>';return}
    list.push({name:f.name,parsed:parsePdfPages(pages)});
  }
  impStart(list);
}
function impFromItems(pagesList,names){ // テスト・保守用：複数PDFの文字データを直接渡す
  if(pagesList.length&&!Array.isArray(pagesList[0][0]))pagesList=[pagesList];
  impStart(pagesList.map((pages,i)=>({name:(names&&names[i])||('PDF'+(i+1)),parsed:parsePdfPages(pages)})));
}
function impStart(list){
  const merged=mergeParsed(list);
  if(!merged.trains.length){const m=$('#impMsg');if(m)m.innerHTML='<span style="color:var(--warn)">時刻表を読み取れませんでした。時刻（例 14:10）が文字として入ったPDFか確認してください。</span>';return}
  impBuild(merged,list.map(x=>x.name).join('、'));impRender();
  $('#imp').classList.add('on');
}
function impBuild(parsed,fileName){
  const names=[...new Set(parsed.trains.flatMap(t=>t.pts.map(p=>p.name)))];
  const res=resolveNames(names);
  const skipSt=TOZAI.filter(n=>names.includes(n)&&res[n]&&res[n].status==='tozai');
  const unknown=names.filter(n=>res[n].status==='unknown');
  const trains=[];
  parsed.trains.forEach(t=>{
    const all=t.pts.map(p=>({name:p.name,min:parseT(p.text),r:res[p.name]})).filter(p=>p.min!=null&&p.r.status!=='unknown');
    all.sort((a,b)=>a.min-b.min);
    const known=all.filter(p=>p.r.status==='ok');
    if(all.length<2||known.length<2)return;
    const o=all[0],d=all[all.length-1],ko=known[0],kd=known[known.length-1];
    trains.push({pts:known,o:o.r.dn,d:d.r.dn,start:o.min,numStart:ko.min,end:d.min,ko:ko.r.dn,kd:kd.r.dn,
      kind:kd.r.idx>=ko.r.idx?1:-1,include:true,no:'',warn:'',file:t.file||0});
  });
  trains.sort((a,b)=>a.start-b.start);
  const date=parsed.date||'',label=('臨時 '+date).trim();
  const same=S.dias.findIndex(d=>d.name===label);
  imp={fileName,parsed,res,skipSt,unknown,trains,
    opts:{target:same>=0?'d'+same:'new',diaName:label,typeSel:String(Math.max(0,S.types.findIndex(x=>x.n.includes('京津')))),auto:true,tmp:''}};
  impNumber();
}
const impDia=()=>imp.opts.target==='new'?null:S.dias[+imp.opts.target.slice(1)];
function impNumber(){

}

  <div class="scrollbox" style="max-height:44vh;border:1px solid var(--line);border-radius:10px"><table class="dt" style="width:100%"><tr><th>取込</th><th>列番</th><th>方向</th><th>始発</th><th>終着</th><th>区間</th><th>注意</th></tr>`;

  });
  h+='</table></div>';
  $('#impBody').innerHTML=h;
  $('#impFoot').innerHTML=`<button data-act="impclose">キャンセル</button><span style="flex:1"></span><button data-act="impnum">列番を付け直す</button><button class="primary" data-act="impgo">${n}本を取り込む</button>`;
}
async function impGo(){
  const o=imp.opts,list=imp.trains.filter(t=>t.include);

function suggestNumberFor(t){

  const nO=S.stations[sp.s0].n,nD=S.stations[sp.s1].n;

}

      x.push(Math.floor(db)-Math.floor(da));y.push(Math.floor(ab)-Math.floor(da));

function sttRun(std,a,b){const ia=std.ord.indexOf(a),ib=std.ord.indexOf(b);let s=0;for(let k=ia;k<ib;k++)s+=std.dd[std.ord[k]+'>'+std.ord[k+1]];return s}
/* 駅ごとの発車時刻（deps: 駅番号 → [{t,dark}]）から、列車を組み立てる（追い越しのない並びを保つ最適な割り当て） */
/* 始発になれる駅：石山坂本線は 坂本比叡山口・近江神宮前・石山寺（花火ダイヤだけ びわ湖浜大津も）、京津線は びわ湖浜大津・四宮・御陵 */
function sttIsOrigin(idx,blk,hanabi){
  const n=(S.stations[idx]&&S.stations[idx].n)||'',lab=(S.blocks[blk]&&S.blocks[blk].label)||'';
  if(lab.includes('京津'))return /浜大津/.test(n)||n==='四宮'||n==='御陵';
  return ['坂本','坂本比叡山口','近江神宮前','石山寺'].includes(n)||(!!hanabi&&/浜大津/.test(n));
}
function sttReconstruct(kind,deps,std,tol,isOrig){
  isOrig=isOrig||(()=>true);
  const ord=std.ord.filter(i=>deps[i]&&deps[i].length);
  let active=[],done=[],endedHist=[]; // endedHist：直前の2駅でつなぎ先が見つからず「終わった」ことにした列車（時刻の読み落としで途切れたものを、つなぎ直すため）
  ord.forEach((idx,k)=>{
    const B=[...deps[idx]].sort((a,b)=>a.t-b.t),prev=k>0?ord[k-1]:null,used=new Set();
    if(prev!==null){
      const A=[...active].sort((x,y)=>x.pts[x.pts.length-1].t-y.pts[y.pts.length-1].t);
      const run=sttRun(std,prev,idx),skipped=Math.max(0,std.ord.indexOf(idx)-std.ord.indexOf(prev)-1),tl=tol+0.7*skipped;
      const n=A.length,m=B.length,INF=1e9,PEN=2.5,PENB=isOrig(idx)?PEN:60; // 始発になれない駅では、前の駅の列車に、なるべくつなぐ
      const dev=(i,j)=>Math.abs(B[j].t-(A[i].pts[A[i].pts.length-1].t+run));
      // つなげる条件：時間をさかのぼらない（次の駅の時刻が、前の駅より前にならない）。始発になれる駅は許容誤差の中、始発になれない駅は「予想より早い側は許容誤差まで、遅い側は15分まで」
      const okLink=(i,j)=>{const l=A[i].pts[A[i].pts.length-1].t,sg=B[j].t-(l+run);if(B[j].t<l)return false;return isOrig(idx)?Math.abs(sg)<=tl:(sg>=-tl&&sg<=15)};
      const f=Array.from({length:n+1},()=>new Array(m+1).fill(INF)),g=Array.from({length:n+1},()=>new Array(m+1).fill(0));
      f[0][0]=0;
      for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){
        if(f[i][j]>=INF)continue;
        if(i<n&&f[i][j]+PEN<f[i+1][j]){f[i+1][j]=f[i][j]+PEN;g[i+1][j]=1}
        if(j<m&&f[i][j]+PENB<f[i][j+1]){f[i][j+1]=f[i][j]+PENB;g[i][j+1]=2}
        if(i<n&&j<m){const d=dev(i,j);if(okLink(i,j)&&f[i][j]+d<f[i+1][j+1]){f[i+1][j+1]=f[i][j]+d;g[i+1][j+1]=3}}
      }
      const matched=new Set();let i=n,j=m;
      while(i>0||j>0){
        const t=g[i][j];
        if(t===3){const d=dev(i-1,j-1);A[i-1].pts.push({idx,t:B[j-1].t,dark:B[j-1].dark});if(d<=tl)A[i-1].maxDev=Math.max(A[i-1].maxDev,d); // 始発になれない駅で、許容誤差を超えて必ずつないだものは、警告にしない
          matched.add(i-1);used.add(j-1);i--;j--}
        else if(t===1)i--;else j--;
      }
      const next=[],ended=[];A.forEach((a,ai)=>{if(matched.has(ai))next.push(a);else{done.push(a);ended.push(a)}});
      // 始発になれない駅で、つなぎ先のない発車時刻が残ったら、直前に途切れた列車につなぎ直す（時刻が1つ抜けていても、列車を切らない）
      if(!isOrig(idx)){
        const cand=[],pool=endedHist.flat();
        B.forEach((b,j)=>{if(used.has(j))return;pool.forEach((a,ai)=>{const last=a.pts[a.pts.length-1];if(std.ord.indexOf(last.idx)>=std.ord.indexOf(idx))return;{const rr=sttRun(std,last.idx,idx),sg=b.t-(last.t+rr);cand.push({j,a,d:Math.abs(sg),ok:b.t>=last.t&&sg>=-(tol+2)&&sg<=15})}})});
        cand.sort((x,y)=>x.d-y.d);const ja=new Set(),aa=new Set();
        cand.forEach(c=>{
          if(ja.has(c.j)||aa.has(c.a)||!c.ok)return;
          ja.add(c.j);aa.add(c.a);used.add(c.j);
          c.a.pts.push({idx,t:B[c.j].t,dark:B[c.j].dark});
          const di=done.indexOf(c.a);if(di>=0)done.splice(di,1);
          next.push(c.a);
        });
        endedHist=endedHist.map(l=>l.filter(a=>!aa.has(a)));
        ended.splice(0,ended.length,...ended.filter(a=>!aa.has(a)));
      }
      endedHist=[ended,...endedHist].slice(0,2);
      active=next;
    }
    B.forEach((b,j)=>{if(!used.has(j))active.push({pts:[{idx,t:b.t,dark:b.dark}],maxDev:0})});
  });
  done=done.concat(active);
  /* 仕上げ：始発になれない駅から始まってしまった列車は、途中で途切れた列車につなぎ直す。
     時刻が抜けた・ずれた・読み違いなどで切れたものを、駅をいくつ飛んでいても、時間の流れ（さかのぼらない・標準の所要時間に近い）に合うものにつなぐ */
  if(ord.length){
    const so=i=>std.ord.indexOf(i);
    const bads=done.filter(t=>t.pts[0].idx!==ord[0]&&!isOrig(t.pts[0].idx));
    const pairs=[];
    bads.forEach(x=>done.forEach(y=>{
      if(y===x)return;
      const ly=y.pts[y.pts.length-1],fx=x.pts[0],ei=so(ly.idx),si=so(fx.idx);
      if(ei<0||si<0||ei>=si)return;
      const sk=si-ei-1,sg=fx.t-(ly.t+sttRun(std,ly.idx,fx.idx));
      if(fx.t<ly.t||sg<-(tol+2)||sg>15+2*sk)return;
      pairs.push({x,y,sc:Math.abs(sg)+0.5*sk});
    }));
    pairs.sort((a,b)=>a.sc-b.sc);
    const ux=new Set(),uy=new Set(),gone=new Set();
    pairs.forEach(q=>{
      if(ux.has(q.x)||uy.has(q.y)||gone.has(q.y))return;
      ux.add(q.x);uy.add(q.y);gone.add(q.x);
      q.y.pts.push(...q.x.pts);
    });
    done=done.filter(t=>!gone.has(t));
  }
  // 終点に着く時刻は駅の時刻表に載っていないので、最後の発車の次の駅に「標準の所要時間」で着くとして足す
  return done.map(tr=>{
    const last=tr.pts[tr.pts.length-1],ai=std.ord.indexOf(last.idx);
    if(ai>=0&&ai<std.ord.length-1){const nx=std.ord[ai+1];tr.pts.push({idx:nx,t:last.t+std.aa[last.idx+'>'+nx],dark:false,arrival:true})}
    return tr;
  });
}

async function sttFromFiles(files){
  const msg=$('#sttMsg');if(msg)msg.textContent='読み取り中…';
  const list=[];
  for(const f of files){
    let page;
    try{page=await sttReadPdf(await f.arrayBuffer())}
    catch(e){
      if(e&&e.message==='unreadable'){

        bigAlert(t);return;
      }

    if(page.suspect){
      const ok=await bigAlert(`「${f.name}」は、文字情報が壊れていて、数字の並びも完全には確認できませんでした。\n画像から数字を読み取った結果を使いますが、間違いが混ざっている可能性があります。\n取り込み前の一覧で、必ず確かめてください。\n\n（${page.suspect}）`,{cancel:'中止する',ok:'確認しながら取り込む'});
      if(!ok){if(msg)msg.textContent='中止しました。';return}
    }
    list.push({name:f.name,page});
  }
  sttStart(list);
}

function sttStart(list){

function sttCompute(){
  const o=stt.opts;stt.trains={};stt.warn=[];stt.missing={};
  stt.files.forEach(f=>{const r=f.page?sttMinutes(f.page,o.firstHour):{cells:f.cells||[],warn:[]};f.cellsC=r.cells;f.warn=r.warn.slice();if(f.page&&f.page.ocr)f.warn.push('文字の層がないPDFなので、画像から数字を読み取りました。時刻を確認してください');f.dark=r.cells.filter(c=>c.dark).length});
  const groups={};
  stt.files.forEach(f=>{
    if(f.stIdx<0)return;
    const blk=blkOfSt(f.stIdx),key=f.day+'|'+f.kind+'|'+blk;(groups[key]=groups[key]||{day:f.day,kind:f.kind,blk,deps:{}});
    if(groups[key].deps[f.stIdx])stt.warn.push(`同じ駅・方向・日のPDFが重なっています：${S.stations[f.stIdx].n}（後のものを使います）`);
    groups[key].deps[f.stIdx]=f.cellsC.map(c=>({t:c.hour*60+c.min,dark:c.dark}));
  });
  Object.values(groups).forEach(g=>{
    const std=sttStd(g.kind,g.blk);
    const have=std.ord.filter(i=>g.deps[i]);
    const miss=std.ord.filter(i=>!g.deps[i]&&std.ord.indexOf(i)>=std.ord.indexOf(have[0])&&std.ord.indexOf(i)<=std.ord.indexOf(have[have.length-1]));
    if(miss.length)stt.missing[g.day+'|'+g.kind+'|'+g.blk]=miss.map(i=>S.stations[i].n);
    const trs=sttReconstruct(g.kind,g.deps,std,o.tol,i=>sttIsOrigin(i,g.blk,o.hanabi));
    (stt.trains[g.day]=stt.trains[g.day]||[]);
    trs.forEach(tr=>{
      const first=tr.pts[0],last=tr.pts[tr.pts.length-1];
      stt.trains[g.day].push({day:g.day,kind:g.kind,pts:tr.pts,o:S.stations[first.idx].n,d:S.stations[last.idx].n,start:first.t,end:last.t,
        dark:tr.pts.some(p=>p.dark),maxDev:tr.maxDev,badStart:!sttIsOrigin(first.idx,g.blk,o.hanabi),include:!(o.gakkyu==='skip'&&tr.pts.some(p=>p.dark)),no:'',warn:''});

}

    <td style="white-space:nowrap">${t.kind>0?'下り':'上り'}${t.dark?' <span class="hint">（学休期運休）</span>':''}</td><td style="white-space:nowrap">${fmtC(t.start)}</td><td style="white-space:nowrap">${fmtC(t.end)}</td>
    <td style="white-space:nowrap">${esc(t.o)}→${esc(t.d)}</td>
    <td>${ends?`<select data-stt-row="${i}" data-k="real"><option value=""${!t.real?' selected':''}>設定どおり</option><option value="C"${t.real==='C'?' selected':''}>太秦天神川</option><option value="K"${t.real==='K'?' selected':''}>京都市役所前</option><option value="M"${t.real==='M'?' selected':''}>御陵のみ</option></select>`:''}</td>
    <td class="hint" style="color:${t.warn?'var(--warn)':'inherit'}">${esc(t.warn)}</td></tr>`;
  });
  h+='</table></div>';
  $('#sttBody').innerHTML=h;
  const total=days.reduce((s,d)=>s+(stt.trains[d]||[]).filter(t=>t.include).length,0);
  $('#sttFoot').innerHTML=`<button data-act="sttclose">キャンセル</button><span style="flex:1"></span><button data-act="sttnum">列番を付け直す</button><button class="primary" data-act="sttgo">${total}本を取り込む</button>`;
}
async function sttGo(){
  const o=stt.opts;let made=0,names=[];
  const plans=stt.days.map(d=>({d,list:(stt.trains[d]||[]).filter(t=>t.include)})).filter(p=>p.list.length);
  if(!plans.length){uiAlert('取り込む列車がありません');return}
  for(const p of plans)if(o.target[p.d]==='new'&&!(o.diaName[p.d]||'').trim()){uiAlert('新しいダイヤの名前を入力してください');return}
  const dup=plans.flatMap(p=>p.list.map(t=>t.no)).filter(Boolean);
  const dupSame=plans.some(p=>{const ns=p.list.map(t=>t.no).filter(Boolean);return ns.length!==new Set(ns).size});
  if(dupSame&&!await uiConfirm('列番が重なっているものがあります。このまま取り込みますか？'))return;
  const type=+o.typeSel;
  plans.forEach(p=>{
    let dia;
    if(o.target[p.d]==='new'){dia={name:o.diaName[p.d].trim(),kudari:[],nobori:[],ex:[]};S.dias.push(dia)}else dia=sttTargetDia(p.d);
    S.di=S.dias.indexOf(dia);
    p.list.forEach(t=>{
      const c=new Array(N()).fill(null);t.pts.forEach(q=>{c[q.idx]={m:1,a:null,d:q.t,t:''}});
      const tr=newTrain({no:t.no,type,c,realEnd:t.real||''});(t.kind>0?dia.kudari:dia.nobori).push(tr);made++;
    });
    names.push(`「${dia.name}」`);
  });
  $('#stt').classList.remove('on');stt=null;
  S.sel=null;tt={tid:null,si:null};save();renderAll();redraw();showView('dia');
  uiAlert(`${made}本を取り込みました（${names.join('、')}）。\n内容を確認して、必要なら「全駅一括編集」で直してください。`);
}

document.addEventListener('change',e=>{
  const el=e.target;if(!el.closest('#stt')||!stt)return;

  if(el.dataset.sttDay!=null){const d=+el.dataset.sttDay,k=el.dataset.k;if(k==='target'){stt.opts.target[d]=el.value;sttNumber()}else stt.opts.diaName[d]=el.value;sttRender();return}
  if(el.dataset.stt){
    const k=el.dataset.stt,o=stt.opts;
    if(k==='auto')o.auto=el.checked;else if(k==='hanabi')o.hanabi=el.value==='1';else if(k==='firstHour'||k==='tol'||k==='view')o[k]=+el.value||(k==='view'?1:0);else o[k]=el.value;
    if(k==='firstHour'||k==='tol')sttCompute();else if(k==='gakkyu'||k==='auto'||k==='tmp'||k==='hanabi'){sttCompute()}
    sttRender();return;
  }
  if(el.dataset.sttRow!=null){
    const t=(stt.trains[stt.opts.view]||[])[+el.dataset.sttRow];

  }
});

/* ---------- 画面を作り直しても、スクロールの位置と入力中の欄を保つ ---------- */
function keepUI(root,fn){ // 1つ入力して保存されても、画面の先頭に戻らず、続けて入力できるようにする
  const pathOf=el=>{const p=[];while(el&&el!==root){const par=el.parentNode;if(!par)return null;p.unshift([...par.children].indexOf(el));el=par}return el===root?p:null};
  const byPath=p=>{let el=root;for(const i of p){el=el&&el.children[i]}return el};
  const sc=[];
  const walk=el=>{if(el.scrollTop>0||el.scrollLeft>0){const p=pathOf(el);if(p)sc.push({p,t:el.scrollTop,l:el.scrollLeft})}for(const c of el.children)walk(c)};
  walk(root);
  const act=document.activeElement,ap=(act&&act!==root&&root.contains(act))?pathOf(act):null;
  const sel=(act&&typeof act.selectionStart==='number')?[act.selectionStart,act.selectionEnd]:null;
  const r=fn();
  sc.forEach(q=>{const el=byPath(q.p);if(el){el.scrollTop=q.t;el.scrollLeft=q.l}});
  if(ap){const el=byPath(ap);if(el&&el.focus){try{el.focus({preventScroll:true});if(sel&&typeof el.selectionStart==='number')el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  return r;
}
const wrapKeep=(fn,sel)=>function(...a){
  const self=this,run=()=>{const r=document.querySelector(sel);return r?keepUI(r,()=>fn.apply(self,a)):fn.apply(self,a)};
  // 次の欄をタップして入力が確定した（change）瞬間は、まだ次の欄にカーソルが移っていないので、移ってから画面を作り直す
  const ev=window.event;
  if(ev&&ev.type==='change'&&(!document.activeElement||document.activeElement===document.body)){setTimeout(run,0);return}
  return run();
};
renderTrains=wrapKeep(renderTrains,'#p-trains');renderAdd=wrapKeep(renderAdd,'#p-add');renderSet=wrapKeep(renderSet,'#p-set');renderLink=wrapKeep(renderLink,'#p-link');
renderTT=wrapKeep(renderTT,'#ttpage');renderTTSide=wrapKeep(renderTTSide,'#ttside');renderUnits=wrapKeep(renderUnits,'#unpage');renderData=wrapKeep(renderData,'#datapage');
renderMy=wrapKeep(renderMy,'#mym');renderDiaModal=wrapKeep(renderDiaModal,'#dim');impRender=wrapKeep(impRender,'#imp');sttRender=wrapKeep(sttRender,'#stt');
